name: docs checks

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-checks.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-checks.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/tools/package-lock.json
      - run: npm ci
        working-directory: docs/tools
      - run: npm run check
        working-directory: docs/tools
      - run: npm run lint
        working-directory: docs/tools

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/tools/package-lock.json
      - run: npm ci
        working-directory: docs/tools
      # Cache the browser download, which is most of this job's runtime.  The
      # key is the Playwright version: a browser build is pinned to it, so a
      # stale cache would be a browser the runner cannot drive.
      - id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
        working-directory: docs/tools
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: docs/tools
      # The browser is cached but its apt dependencies are not.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: docs/tools
      - run: npm test
        working-directory: docs/tools
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: docs/tools/playwright-report/
          retention-days: 7
