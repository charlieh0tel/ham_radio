name: lint

# No path filter: these jobs are meant to be required checks, and a required
# check that is skipped by a path filter never reports.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Pinned so a new ruff release cannot turn a required check red.
  RUFF_VERSION: '0.15.10'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # shellcheck is preinstalled on the runner image.
      - run: git ls-files -z '*.sh' githooks | xargs -0 shellcheck

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uvx "ruff@${RUFF_VERSION}" check .
      - run: uvx "ruff@${RUFF_VERSION}" format --check .
