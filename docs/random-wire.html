  <title>Random Wire Antenna Length Calculator</title>
  <meta name="description" content="Pick end-fed random wire lengths that avoid half-wave resonances on the US ham bands you care about.">

  <style>
    body { margin: 0; }

    /* Layout */
    .app {
      position: relative;
      min-height: 100vh;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: "JetBrains Mono", "SF Mono", Monaco, Consolas, monospace;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

     * Diagonal corner ribbon, top right.  The wrapper is a fixed square
     * pinned to the corner with overflow hidden; the band inside is rotated
     * 45 degrees and made wide enough that its ends are clipped away, which
     * is what gives the mitred look without drawing the triangle.
     */
    /* Preset buttons sitting under a slider, e.g. the return-path lengths. */
    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .ribbon {
      position: absolute;
      top: 0;
      right: 0;
      width: 104px;
      height: 104px;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

    .ribbon span {
      position: absolute;
      display: block;
      width: 150px;
      padding: 3px 0;
      top: 26px;
      right: -38px;
      transform: rotate(45deg);
      /*
       * Translucent so the title reads through it.  The ribbon overlays the
       * viewport corner and the title is nearly viewport-wide, so they
       * collide at any size worth reading; letting it wash over is cheaper
       * than reserving a band of empty page for it.
       */
      background: rgba(139, 26, 26, 0.55);
      color: rgba(255, 232, 232, 0.85);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);

    .title {
      font-size: 18px;

      letter-spacing: 0.05em;
      color: #fff;
      margin: 0;
      text-transform: uppercase;
      text-align: center;
    }

    .main-content {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1 1 320px;
      min-width: 300px;
    }

    .column-wide {
      flex: 2 1 560px;
    }

    .panel {
      background: #1a1a1a;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;

    .panel-header {

      font-size: 9px;
      color: #949494;
      font-weight: 400;
    }

      display: flex;
      gap: 6px;
      background: #111;
      padding: 4px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

      flex: 1;
      padding: 6px 10px;
      background: transparent;
      color: #777;

    .segment-btn.active { background: #333; color: #fff; }

      display: block;
      margin-bottom: 14px;
      font-size: 12px;
      color: #888;
    }

    .control-label:last-child { margin-bottom: 0; }

    /*
     * A group of buttons where one is chosen.  fieldset rather than label:
     * a label with no `for` binds to its first labelable descendant, so
     * clicking the word "Ground" was activating the first soil button.

    .control-group {
      display: block;
      margin: 0 0 14px;
      padding: 0;
      border: 0;
    }

    .control-group:last-child { margin-bottom: 0; }

    /*

    .control-slider { width: 100%; margin-top: 4px; }

    tr.pick:hover td { background: #222; color: #fff; }

    /*
     * The length itself is the control.  A row with an onClick handler is

    .pick-btn {
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      color: inherit;

      text-align: left;

    .best-length { color: #4fd1ab; font-weight: 600; }

    .empty-note { font-size: 11px; color: #949494; }

    .link-btn {

      color: #4fd1ab;
      font-size: 11px;
      font-weight: 600;
      padding: 0;

      font-size: 12px;
      color: #949494;

    }

    .info strong { color: #aaa; }

    .footer {

    @media (max-width: 800px) {
      .app { padding: 16px; gap: 16px; }
      .column, .column-wide { min-width: unset; width: 100%; }

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    // BEGIN PURE
    // Everything to END PURE is free of React, window and document, so
    // tools/extract-model.mjs can pull it out and run it under node for the
    // tests.  Keep it that way: a DOM reference in here breaks `npm test`.

    // ============================================================
    // Constants
    // ============================================================

    /** Speed of light, m/s. */
    const C_SPEED = 299792458;

    /** Feet per meter (exact, by definition of the international foot). */
    const FT_PER_M = 1 / 0.3048;

    /**
     * Amateur band edges in kHz, per region.
     *   m:     band wavelength in meters, the key used everywhere else
     *   full:  whole band
     *   cw:    CW / narrowband segment
     * National rules vary inside each IARU region; the region entries follow
     * the IARU band plans, and the US entry follows FCC allocations.
     * The shape is left to inference so that the region keys stay a literal
     * union; an Object<string, ...> annotation would widen them to string and
     * let a bad ?region= through the lookup.
     */
    const REGIONS = Object.freeze({
      us: {
        label: 'United States',
        note: '47 CFR 97.301, per the ARRL frequency chart. Includes the 60m '
          + 'rules effective 13 Feb 2026.',
        bands: [
          // 2200m and 630m were allocated in 2017; both are secondary and
          // power limited, but the half-wave lengths still apply.
          { m: 160,  label: '160m',  full: [1.8e6, 2e6],         cw: [1.8e6, 1.84e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 4e6],         cw: [3.5e6, 3.6e6] },
          // Since 13 Feb 2026: the 5351.5-5366.5 kHz band at 9.15 W ERP, plus
          // four retained 2.8 kHz channels centered on 5332, 5348, 5373 and
          // 5405 kHz at 100 W ERP.  The span below covers all of it.
          // US 60 m is one 15 kHz band plus four discrete channels.  Only the
          // band is modelled: sampling across the whole 5.3306-5.4064 MHz
          // envelope would put most samples on spectrum nobody may transmit
          // on, and would widen the classical keep-out zones to match.
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.3665e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.3e6],         cw: [7e6, 7.125e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.15e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.15e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.11e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.2e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.93e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.3e6] },
        ],
      },
      r1: {
        label: 'IARU Region 1',
        note: 'Europe, Africa, Middle East, northern Asia. 6m upper edge varies by country.',
        bands: [
          { m: 160,  label: '160m',  full: [1.81e6, 2e6],        cw: [1.81e6, 1.838e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 3.8e6],       cw: [3.5e6, 3.57e6] },
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.354e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.2e6],         cw: [7e6, 7.04e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.13e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.07e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.095e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.07e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.915e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.07e6] },
        ],
      },
      r2: {
        label: 'IARU Region 2',
        note: 'The Americas. National allocations differ; the US entry is more specific.',
        bands: [
          { m: 160,  label: '160m',  full: [1.8e6, 2e6],         cw: [1.8e6, 1.84e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 4e6],         cw: [3.5e6, 3.58e6] },
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.354e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.3e6],         cw: [7e6, 7.05e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.13e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.07e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.095e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.07e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.915e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.07e6] },
        ],
      },
      r3: {
        label: 'IARU Region 3',
        note: 'Asia-Pacific. 80m and 40m upper edges vary widely by country.',
        bands: [
          { m: 160,  label: '160m',  full: [1.8e6, 2e6],         cw: [1.8e6, 1.84e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 3.9e6],       cw: [3.5e6, 3.54e6] },
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.354e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.3e6],         cw: [7e6, 7.04e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.13e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.07e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.095e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.07e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.915e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.07e6] },
        ],
      },
    });

    /**
     * Units carried by the numbers below.  These are aliases, not distinct
     * types, so they document intent without forcing a cast at every step of
     * a calculation; the checker still catches a length passed where a
     * frequency belongs only where the alias appears in a signature.
     *
     * @typedef {number} Meters
     * @typedef {number} Hertz
     */

    /**
     * @typedef {Object} Band
     * @property {number} m      band wavelength in meters, the key used elsewhere
     * @property {string} label
     * @property {Hertz[]} full  whole-band edges, low first
     * @property {Hertz[]} cw    CW / narrowband segment edges
     *
     * @typedef {keyof typeof REGIONS} RegionKey
     * @typedef {keyof typeof SEGMENTS} SegmentKey
     * @typedef {keyof typeof MODES} ModeKey
     * @typedef {keyof typeof UNITS} UnitKey
     *
     * A length interval to keep away from, and why.
     * @typedef {Object} Interval
     * @property {Meters} lo
     * @property {Meters} hi
     * @property {string} [label]
     * @property {string} [kind]
     *
     * A clear span, with the length to recommend inside it.
     * @typedef {Object} Span
     * @property {Meters} lo
     * @property {Meters} hi
     * @property {Meters} pick
     * @property {Meters} clearance
     */

    /**
     * Bands available in a region.
     * @param {RegionKey} region
     * @returns {Band[]}
     */
    const bandsIn = (region) => REGIONS[region].bands;

    /** Band-selection presets, by band wavelength in meters. */
    const PRESETS = Object.freeze([
      { label: 'HF all',   bands: [160, 80, 60, 40, 30, 20, 17, 15, 12, 10] },
      { label: 'Classic',  bands: [80, 40, 20, 15, 10] },
      { label: 'WARC',     bands: [30, 17, 12] },
      { label: '40-10',    bands: [40, 30, 20, 17, 15, 12, 10] },
      { label: 'Clear',    bands: [] },
    ]);

    /** Wire-end-effect / velocity factor of a thin wire in free space. */
    const DEFAULT_VELOCITY_FACTOR = 0.95;

    /** Default clearance to keep from a half-wave resonance, percent of length. */
    const DEFAULT_MARGIN_PCT = 5;

    /** Range the velocity factor is held to; outside it the math degenerates. */
    const VELOCITY_FACTOR_RANGE = Object.freeze({ min: 0.5, max: 1 });

    /** Range the clearance margin is held to, percent of a half wavelength. */
    const MARGIN_PCT_RANGE = Object.freeze({ min: 0, max: 15 });

    /** Number of best-length suggestions listed. */
    const MAX_SUGGESTIONS = 8;

    /**
     * Lengths the published random-wire tables offer, feet.  Scored and shown
     * rather than quietly left out.
     *
     * The impedance model disagrees with some of them, 71 ft most sharply,
     * and the disagreement is traceable: the tables place n*lambda/2 at a
     * velocity factor of 0.95, which puts the 40 m half wave at 65.3 ft and
     * leaves 71 ft 8.7 percent clear.  Fitted against NEC the antenna line
     * runs at 1.0, putting it at 68.8 ft and leaving 3.2 percent, and NEC
     * reads the SWR there accordingly.
     *
     * Omitting them in silence spends the page's credibility on a
     * disagreement it can explain, so it explains it instead.  See
     * docs/RANDOM_WIRE_MODEL.md.
     */
    const PUBLISHED_FT = Object.freeze(
      [29, 35.5, 41, 58, 71, 84, 107, 119, 148, 203]);

    /** Below this, a length displays fine at one decimal, in display units. */
    const LEN_ROUNDING_SLOP = 0.005;

    /** Inches per foot, and the decimals kept on the inches part. */
    const INCHES_PER_FT = 12;
    const INCH_DIGITS = 1;

    /** Feed system the impedance mode scores against. */
    const Z_SYSTEM_OHMS = 50;

    /**
     * Impedance ratios offered for the transformer at the feedpoint: a direct
     * connection, the usual 4:1 and 9:1 ununs for a random wire, and the 49:1
     * and 64:1 wound for end-fed half waves.
     */
    const UNUN_RATIOS = Object.freeze([1, 4, 9, 49, 64]);
    const DEFAULT_UNUN_RATIO = 9;

    /**
     * Soils the model is fitted for, the three standard NEC cases.
     *
     * Deliberately not labelled poor/average/good as if that were a quality
     * axis.  Better ground does not give a better match: it gives a sharper
     * resonance, so deeper minima and higher peaks.  Permittivity shifts the
     * effective electrical length while conductivity damps, and the two do
     * not move together across these three.
     *

        ? [{ lo: 0, hi: shortLimit, label: 'shorter than λ/4', kind: 'short' }]
        : [];
      const avoid = [...shortZone, ...resonances];
      const merged = mergeIntervals(avoid);
      const usable = usableIntervals(merged, maxLenM);
      const suggestions = [...usable]
        .map(u => ({ ...u, pick: pickInSpan(u, units), clearance: (u.hi - u.lo) / 2 }))
        .sort((a, b) => b.clearance - a.clearance)
        .slice(0, MAX_SUGGESTIONS);
      return { bands, avoid, merged, usable, suggestions, shortLimit };
    };

    /**
     * Recommended length from the usable span nearest to lenM, or null if
     * none is left.  Taken from the middle of the span rather than its closest
     * edge, so the suggestion has the most clearance that span can offer.
     *
     * @param {Meters} lenM
     * @param {{lo: Meters, hi: Meters}[]} usable
     * @param {UnitKey} units
     * @returns {?Meters}
     */
    const nearestClearLength = (lenM, usable, units) => {
      /** @type {?Meters} */
      let best = null;
      for (const span of usable) {
        const center = pickInSpan(span, units);
        if (!best || Math.abs(center - lenM) < Math.abs(best - lenM)) best = center;
      }
      return best;
    };

    /**
     * The largest clearance margin, below the one asked for, that still leaves
     * somewhere to put the wire.  Used to turn "no clear span" into a concrete
     * offer.  Binary search: feasibility is monotonic in the margin, since
     * widening every zone can only remove spans.
     *
     * @param {RegionKey} region
     * @param {number[]} bandsM
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} askedPct
     * @param {Meters} maxLenM
     * @param {UnitKey} units
     * @returns {?{marginPct:number, lengthM:Meters}} null if even a margin of
     *          zero leaves nothing, i.e. the bands cover every length outright.
     */
    const bestFeasibleMargin = (region, bandsM, segment, velocityFactor,
                                askedPct, maxLenM, units) => {
      /** @param {number} pct */
      const spansAt = (pct) =>
        solve(region, bandsM, segment, velocityFactor, pct, maxLenM, units).suggestions;
      if (spansAt(0).length === 0) return null;

      let feasible = 0;
      let tooWide = askedPct;
      for (let i = 0; i < MARGIN_SEARCH_STEPS; i++) {
        const mid = (feasible + tooWide) / 2;
        if (spansAt(mid).length > 0) feasible = mid; else tooWide = mid;
      }
      // Round down to the slider's step so the offer is one the user can set.
      const marginPct = Math.floor(feasible / MARGIN_STEP_PCT) * MARGIN_STEP_PCT;
      const best = spansAt(marginPct)[0];
      return best ? { marginPct, lengthM: best.pick } : null;
    };

    /**
     * Judge one wire length against the selected bands directly, rather than
     * against the precomputed map intervals, so that lengths past the end of
     * the map are still answered correctly.
     *
     * Only the multiples that can bracket lenM are examined: for band n,
     * lenM lies between the nth and (n+1)th resonance for n around
     * lenM / (half wave).
     *
     * @param {Meters} lenM
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} marginPct
     * @param {Meters} shortLimit
     * @returns {?({ok: true, hit: null, nearest: Required<Interval>, clearance: Meters}
     *            | {ok: false, hit: Required<Interval>, nearest: Required<Interval>,
     *               clearance: Meters})}
     *          clearance is the distance in feet to the nearest zone edge.
     */
    const judgeLength = (lenM, bands, segment, velocityFactor, marginPct, shortLimit) => {
      if (!(lenM > 0)) return null;
      const margin = marginPct / 100;
      /** @type {Required<Interval>[]} */
      const zones = [];

      if (shortLimit > 0) {
        zones.push({ lo: 0, hi: shortLimit, label: 'shorter than λ/4', kind: 'short' });
      }
      for (const band of bands) {
        const [loHz, hiHz] = bandEdgesHz(band, segment);
        const shortest = halfWaveM(hiHz, velocityFactor);
        const longest = halfWaveM(loHz, velocityFactor);
        if (!(shortest > 0)) continue;  // degenerate velocity factor
        const nLo = Math.max(1, Math.floor(lenM / longest - margin));
        const nHi = Math.ceil(lenM / shortest + margin);
        for (let n = nLo; n <= nHi; n++) {
          zones.push(resonanceInterval(band, segment, velocityFactor, margin, n));
        }
      }

      // Nothing selected to judge against, so there is no verdict to give.
      if (zones.length === 0) return null;

      const hit = zones.find(z => lenM >= z.lo && lenM <= z.hi) ?? null;

      // Inside a zone, the only distance worth reporting is the way out of
      // that zone; taking a minimum over the others would quote a figure
      // belonging to a zone the message does not name.
      if (hit) {
        return { ok: false, hit, nearest: hit,
                 clearance: Math.min(lenM - hit.lo, hit.hi - lenM) };
      }

      /** @type {?Required<Interval>} */
      let nearest = null;
      let clearance = Infinity;
      for (const zone of zones) {
        const distance = Math.min(Math.abs(lenM - zone.lo), Math.abs(lenM - zone.hi));
        if (distance < clearance) {
          clearance = distance;
          nearest = zone;
        }
      }
      // zones is non-empty here, so the loop above always set nearest.
      return { ok: true, hit: null,
               nearest: /** @type {Required<Interval>} */ (nearest),
               clearance: Number.isFinite(clearance) ? clearance : 0 };
    };

    // ============================================================
    // Feedpoint impedance
    //
    // The keep-out rule above is a proxy: half-wave multiples are bad
    // because the feedpoint impedance spikes there.  This models the
    // impedance directly, so a length can be scored rather than merely
    // accepted or rejected.  It also sees the low impedance of an odd
    // quarter wave, which the keep-out rule cannot express.
    // ============================================================

    /**
     * Minimal complex arithmetic; only what the impedance model needs.
     * @typedef {{re: number, im: number}} Complex
     */
    /** @param {number} re @param {number} im @returns {Complex} */
    const cpx = (re, im) => ({ re, im });
    /** @param {Complex} a @param {Complex} b @returns {Complex} */
    const cAdd = (a, b) => cpx(a.re + b.re, a.im + b.im);
    /** @param {Complex} a @param {Complex} b @returns {Complex} */
    const cSub = (a, b) => cpx(a.re - b.re, a.im - b.im);
    /** @param {Complex} a @param {Complex} b @returns {Complex} */
    const cMul = (a, b) => cpx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
    /** @param {Complex} a @param {Complex} b @returns {Complex} */
    const cDiv = (a, b) => {
      const d = b.re * b.re + b.im * b.im;
      return cpx((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d);
    };
    /** @param {Complex} a @returns {number} */
    const cAbs = (a) => Math.hypot(a.re, a.im);
    /** @param {Complex} z @returns {Complex} */
    const cCosh = (z) => cpx(Math.cosh(z.re) * Math.cos(z.im), Math.sinh(z.re) * Math.sin(z.im));
    /** @param {Complex} z @returns {Complex} */
    const cSinh = (z) => cpx(Math.sinh(z.re) * Math.cos(z.im), Math.cosh(z.re) * Math.sin(z.im));
    /** @param {Complex} z @returns {Complex} */
    const cCoth = (z) => cDiv(cCosh(z), cSinh(z));

    /**
     * Average characteristic impedance of a wire antenna, in ohms.
     * Schelkunoff's thin-wire result, Z0 = 60 (ln(2l/a) - 1), for a wire of
     * length l and radius a.
     *
     * @param {Meters} lenM
     * @param {Meters} radiusM
     * @returns {number} ohms
     */
    const wireZ0 = (lenM, radiusM) => 60 * (Math.log(2 * lenM / radiusM) - 1);

    /**
     * One fitted coefficient at a given height in wavelengths, interpolated
     * linearly in log10(h/lambda) between the table nodes and held flat
     * outside them.
     *
     * @param {number[]} values  parallel to MODEL_H_NODES
     * @param {number} hOverLam
     * @returns {number}
     */
    const interpCoeff = (values, hOverLam) => {
      const nodes = MODEL_H_NODES;
      const last = nodes.length - 1;
      if (hOverLam <= nodes[0]) return values[0];
      if (hOverLam >= nodes[last]) return values[last];
      const x = Math.log10(hOverLam);
      let i = 0;
      while (i < last && Math.log10(nodes[i + 1]) < x) i++;
      const lo = Math.log10(nodes[i]);
      const hi = Math.log10(nodes[i + 1]);
      const t = (x - lo) / (hi - lo);
      return values[i] + t * (values[i + 1] - values[i]);
    };

    /**
     * One transmission line, open at the far end: Z = k Z0 coth(gamma l),
     * with alpha given in nepers per wavelength.
     *
     * @param {Meters} lenM
     * @param {Meters} wavelengthM
     * @param {Meters} radiusM
     * @param {number} alphaPerLambda
     * @param {number} velocityFactor
     * @param {number} z0Scale
     * @returns {Complex} ohms
     */
    const lineZ = (lenM, wavelengthM, radiusM, alphaPerLambda, velocityFactor,
                   z0Scale) => {
      const z0 = z0Scale * wireZ0(lenM, radiusM);
      const alpha = alphaPerLambda / wavelengthM;
      const beta = 2 * Math.PI / (wavelengthM * velocityFactor);
      return cMul(cpx(z0, 0), cCoth(cpx(alpha * lenM, beta * lenM)));
    };

    /**
     * Feedpoint impedance of an end-fed wire, as the antenna line and the
     * return path in series:
     *
     *     Zin = Za(l) + Zr(h + ret)
     *
     * The return path is part of the antenna, not a passive reference.  It
     * radiates, and it resonates on its own with a half-wavelength period in
     * (drop + run); when that nears a half wave it sets the feedpoint outright
     * and the antenna length stops mattering.  About 35 ft of drop plus run is
     * a half wave on 20 m, and the resonance repeats every half wave after
     * that, so across the HF bands most installations sit near one of them.
     *
     * Coefficients are fitted against NEC; see docs/RANDOM_WIRE_MODEL.md for
     * the sweep, the decomposition it rests on, and the error bound.  This is
     * an envelope, not a prediction of a particular installation.
     *
     * @param {Meters} lenM
     * @param {Hertz} freqHz
     * @param {Site} site
     * @param {Meters} radiusM
     * @returns {Complex} ohms
     */
    const endFedZin = (lenM, freqHz, site, radiusM) => {
      const wavelengthM = C_SPEED / freqHz;
      const coeffs = MODEL_COEFFS[site.soil];
      const hOverLam = site.heightM / wavelengthM;
      // site.returnM already includes the drop; see DEFAULT_RETURN_M.
      const returnM = site.returnM;
      const za = lineZ(lenM, wavelengthM, radiusM,
                       interpCoeff(coeffs.alphaA, hOverLam), MODEL_VF_A,
                       interpCoeff(coeffs.kA, hOverLam));
      const zr = lineZ(returnM, wavelengthM, radiusM,
                       interpCoeff(coeffs.alphaR, hOverLam),
                       interpCoeff(coeffs.vfR, hOverLam),
                       interpCoeff(coeffs.kR, hOverLam));
      return cAdd(za, zr);
    };

    /**
     * SWR seen at the radio, through the unun, for a feedpoint impedance.
     * @param {Complex} zLoad
     * @param {number} ununRatio  impedance ratio, 1 for a direct connection
     * @returns {number}
     */
    const swrAtRadio = (zLoad, ununRatio) => {
      const zRadio = cpx(zLoad.re / ununRatio, zLoad.im / ununRatio);
      const gamma = cDiv(cSub(zRadio, cpx(Z_SYSTEM_OHMS, 0)),
                         cAdd(zRadio, cpx(Z_SYSTEM_OHMS, 0)));
      const magnitude = Math.min(cAbs(gamma), MAX_GAMMA);
      return (1 + magnitude) / (1 - magnitude);
    };

    /**
     * Score one length against the selected bands: the geometric mean of the
     * SWR at the radio, sampled across every band.
     *
     * The mean is geometric because SWR is a ratio.  A worst-case score was
     * tried first and is useless: the lowest band always sets it, so the score
     * collapses into "prefer the longest wire" no matter what else happens.
     *
     * @param {Meters} lenM
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {Meters} radiusM
     * @param {number} ununRatio
     * @returns {?{swr: number, worst: {swr: number, band: Band, freqHz: Hertz}}}
     */
    const scoreLength = (lenM, bands, segment, site, radiusM, ununRatio) => {
      let logSum = 0;
      let count = 0;
      /** @type {?{swr: number, band: Band, freqHz: Hertz}} */
      let worst = null;
      for (const band of bands) {
        const [loHz, hiHz] = bandEdgesHz(band, segment);
        for (let i = 0; i < SWR_SAMPLES_PER_BAND; i++) {
          const freqHz = loHz + (hiHz - loHz) * i / (SWR_SAMPLES_PER_BAND - 1);
          const swr = swrAtRadio(endFedZin(lenM, freqHz, site, radiusM),
                                 ununRatio);
          logSum += Math.log(swr);
          count++;
          if (worst === null || swr > worst.swr) worst = { swr, band, freqHz };
        }
      }
      if (count === 0 || worst === null) return null;
      return { swr: Math.exp(logSum / count), worst };
    };

    /**
     * @typedef {Object} ScorePoint
     * @property {Meters} lenM
     * @property {number} swr          geometric mean across the selected bands
     * @property {{swr: number, band: Band, freqHz: Hertz}} worst
     */

    /**
     * The worst band of the worst length the classical rule recommends, as
     * SWR at the radio through a transformer.
     *
     * Priced on the recommendations rather than on every length the rule
     * permits.  A user picks from the suggestions, so what the margin is
     * worth to them is what the suggestions are worth; the worst corner of a
     * usable span is a length nobody was offered.
     *
     * The classical rule is arithmetic with no impedance in it, which is its
     * virtue, so this deliberately changes nothing it recommends.  It only
     * says what the margin buys, in the currency the impedance mode already
     * grades in, because a percentage of a half wave means nothing alone.
     * Modelled, therefore, and labelled as such where it is shown.
     *
     * @param {Span[]} suggestions
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {number} ununRatio
     * @returns {?number} SWR, or null if nothing was suggested
     */
    const worstSuggestedSwr = (suggestions, bands, segment, site, ununRatio) => {
      let worst = 0;
      for (const span of suggestions) {
        const scored = scoreLength(span.pick, bands, segment, site,
                                   WIRE_RADIUS_M, ununRatio);
        if (scored) worst = Math.max(worst, scored.worst.swr);
      }
      return worst > 0 ? worst : null;
    };

    /**
     * Score the whole length axis, then offer its local minima best first.
     * Only strict minima are offered: a length partway down a slope is always
     * bettered by moving along it, so it is not worth recommending.
     *
     * @param {RegionKey} region
     * @param {number[]} bandsM
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {Meters} radiusM
     * @param {number} ununRatio
     * @param {Meters} maxLenM
     * @param {UnitKey} units
     * @returns {{bands: Band[], curve: ScorePoint[], suggestions: ScorePoint[],
     *            shortLimit: Meters}}
     */
    const solveImpedance = (region, bandsM, segment, site, radiusM,
                            ununRatio, maxLenM, units) => {
      const bands = bandsIn(region).filter(b => bandsM.includes(b.m));
      // The impedance mode does not take a velocity factor; the fitted model
      // carries its own, so the short limit uses the same one.
      const shortLimit = tooShortM(bands, segment, MODEL_VF_A);
      if (bands.length === 0) return { bands, curve: [], suggestions: [], shortLimit };

      const step = maxLenM / (SCORE_SAMPLES - 1);
      /** @type {ScorePoint[]} */
      const curve = [];
      for (let i = 0; i < SCORE_SAMPLES; i++) {
        const lenM = Math.max(step, i * step);
        const scored = scoreLength(lenM, bands, segment, site, radiusM,
                                   ununRatio);
        if (scored) curve.push({ lenM, swr: scored.swr, worst: scored.worst });
      }

      // A minimum lands wherever the sample grid happens to fall, so the raw
      // length is an artefact of SCORE_SAMPLES rather than a figure anyone
      // should cut wire to.  Round it the way the classical mode does, then
      // score the rounded length, so the number shown and the SWR beside it
      // describe the same wire.  Two minima can round together, in which case
      // the better one wins.
      /** @type {Map<number, ScorePoint>} */
      const byLength = new Map();
      for (let i = 1; i < curve.length - 1; i++) {
        const point = curve[i];
        if (point.swr >= curve[i - 1].swr || point.swr > curve[i + 1].swr) continue;
        if (point.lenM < shortLimit) continue;
        const lenM = roundToUnit(point.lenM, units);
        if (lenM < shortLimit) continue;
        const scored = scoreLength(lenM, bands, segment, site, radiusM, ununRatio);
        if (!scored) continue;
        const existing = byLength.get(lenM);
        if (existing === undefined || scored.swr < existing.swr) {
          byLength.set(lenM, { lenM, swr: scored.swr, worst: scored.worst });
        }
      }

      const suggestions = [...byLength.values()]
        .sort((a, b) => a.swr - b.swr)
        .slice(0, MAX_SUGGESTIONS);
      return { bands, curve, suggestions, shortLimit };
    };

    // ============================================================
    // NEC deck
    // ============================================================

    /**
     * How high the return conductor lies, metres.  Not zero: bonding it to
     * ground would short the source.  This is the geometry the coefficients
     * were fitted at, so a deck built any other way is a different antenna
     * from the one the page just scored; see nec/random_wire/nec_model.py,
     * which explains why 5 cm stands for a feedline or counterpoise on the
     * soil and does not stand for an elevated one.
     */
    const DECK_RETURN_HEIGHT_M = 0.05;

    /**
     * Segmentation, matching the fitting runs: 20 segments per wavelength is
     * the usual NEC accuracy rule, and a floor keeps a short wire from being
     * described by two or three.  Counts are made odd so a centre segment
     * exists, and capped because NEC-2 builds a dense matrix and the browser
     * solvers this deck is aimed at cap it too.
     */
    const DECK_SEGMENTS_PER_WAVELENGTH = 20;
    const DECK_MIN_SEGMENTS = 9;
    const DECK_MAX_SEGMENTS = 199;

    /**
     * Frequencies in the swept FR card.  A NEC-2 FR card sweeps linearly, so
     * one card cannot follow the selected bands and skip the gaps; the deck
     * spans from the lowest selected band edge to the highest and lets the
     * user read the bands off the result.  201 is the most a swept FR card is
     * usually given, and readers that cap the count cap it there.
     */
    const DECK_SWEEP_POINTS = 201;

    /** Decimals used for metres, radii and megahertz in a card. */
    const DECK_LEN_DIGITS = 4;
    const DECK_RADIUS_DIGITS = 6;
    const DECK_MHZ_DIGITS = 6;

    /**
     * Segment count for one wire at the top of the sweep, where segments are
     * electrically longest.
     *
     * @param {Meters} lenM
     * @param {Meters} wavelengthM  shortest wavelength in the sweep
     * @returns {number}
     */
    const deckSegments = (lenM, wavelengthM) => {
      const n = Math.ceil(DECK_SEGMENTS_PER_WAVELENGTH * lenM / wavelengthM);
      const bounded = Math.min(Math.max(n, DECK_MIN_SEGMENTS), DECK_MAX_SEGMENTS);
      return bounded % 2 === 0 ? bounded - 1 : bounded;
    };

    /**
     * The linear frequency sweep covering every selected band.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @returns {?{startHz: Hertz, stepHz: Hertz, points: number}}
     */
    const deckSweep = (bands, segment) => {
      if (bands.length === 0) return null;
      const edges = bands.map(band => bandEdgesHz(band, segment));
      const startHz = Math.min(...edges.map(([lo]) => lo));
      const stopHz = Math.max(...edges.map(([, hi]) => hi));
      if (stopHz <= startHz) return { startHz, stepHz: 0, points: 1 };
      return {
        startHz,
        stepHz: (stopHz - startHz) / (DECK_SWEEP_POINTS - 1),
        points: DECK_SWEEP_POINTS,
      };
    };

    /**
     * @typedef {Object} DeckWire  one NEC wire, metres throughout
     * @property {number} tag
     * @property {number} segments
     * @property {Meters} x1
     * @property {Meters} y1
     * @property {Meters} z1
     * @property {Meters} x2
     * @property {Meters} y2
     * @property {Meters} z2
     * @property {Meters} radius
     */

    /**
     * The wires of the installation, as the model was fitted at: the antenna
     * horizontal at the wire height, fed at the end; a vertical drop from the
     * feedpoint to just above ground; and the rest of the return conductor
     * running horizontally at that height, out along the antenna.
     *
     * `site.returnM` is the whole return conductor, so the horizontal run is
     * what is left of it after the drop.  A wire of no length is left out
     * rather than emitted as a point.
     *
     * Shared by both exports, so the deck and the project file cannot come to
     * describe two different antennas.
     *
     * @param {Meters} lenM
     * @param {Site} site
     * @param {Meters} radiusM
     * @param {Meters} wavelengthM  shortest wavelength in the sweep
     * @returns {DeckWire[]}
     */
    const deckWires = (lenM, site, radiusM, wavelengthM) => {
      const dropM = Math.max(site.heightM - DECK_RETURN_HEIGHT_M, 0);
      const runM = Math.max(site.returnM - site.heightM, 0);
      /** @type {DeckWire[]} */
      const wires = [{
        tag: 1, segments: deckSegments(lenM, wavelengthM),
        x1: 0, y1: 0, z1: site.heightM,
        x2: lenM, y2: 0, z2: site.heightM, radius: radiusM,
      }];
      if (dropM > 0) {
        wires.push({
          tag: 2, segments: deckSegments(dropM, wavelengthM),
          x1: 0, y1: 0, z1: site.heightM,
          x2: 0, y2: 0, z2: DECK_RETURN_HEIGHT_M, radius: radiusM,
        });
      }
      if (runM > 0) {
        wires.push({
          tag: 3, segments: deckSegments(runM, wavelengthM),
          x1: 0, y1: 0, z1: DECK_RETURN_HEIGHT_M,
          x2: runM, y2: 0, z2: DECK_RETURN_HEIGHT_M, radius: radiusM,
        });
      }
      return wires;
    };

    /**
     * The shortest wavelength a sweep reaches, which is what segmentation has
     * to be adequate at.
     *
     * @param {{startHz: Hertz, stepHz: Hertz, points: number}} sweep
     * @returns {Meters}
     */
    const sweepShortestWaveM = (sweep) =>
      C_SPEED / (sweep.startHz + sweep.stepHz * (sweep.points - 1));

    /**
     * A NEC-2 input deck for the installation on screen, as card text.
     *
     * The source sits on the first segment of the antenna wire, at the
     * junction with the return, which is where a real unun goes.  Ground is
     * GN 2, the Sommerfeld-Norton solution, with the soil's own constants:
     * GN 1 is a perfect plane and would answer a different question.
     *
     * Cards are free format, which every NEC-2 reader accepts.
     *
     * @param {Meters} lenM
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {Meters} radiusM
     * @returns {?string}  null when there is nothing to sweep
     */
    const buildNecDeck = (lenM, bands, segment, site, radiusM) => {
      const sweep = deckSweep(bands, segment);
      if (sweep === null || lenM <= 0) return null;

      const soil = SOILS[site.soil];
      const wires = deckWires(lenM, site, radiusM, sweepShortestWaveM(sweep));

      const len = (/** @type {Meters} */ value) => value.toFixed(DECK_LEN_DIGITS);
      const mhz = (/** @type {Hertz} */ freqHz) =>
        (freqHz / 1e6).toFixed(DECK_MHZ_DIGITS);

      const cards = [
        `CM Random wire ${len(lenM)} m at ${len(site.heightM)} m,`
          + ` ${len(site.returnM)} m return over ${soil.label.toLowerCase()} soil`,
        'CM Generated by random-wire.html.  Geometry per',
        'CM nec/random_wire/nec_model.py: tag 1 antenna, tag 2 drop, tag 3 return run.',
        'CM The result is the feedpoint impedance, ahead of any unun.',
        'CE',
      ];
      for (const wire of wires) {
        cards.push(`GW ${wire.tag} ${wire.segments} ${len(wire.x1)} ${len(wire.y1)}`
          + ` ${len(wire.z1)} ${len(wire.x2)} ${len(wire.y2)} ${len(wire.z2)}`
          + ` ${wire.radius.toFixed(DECK_RADIUS_DIGITS)}`);
      }
      cards.push(
        // GE 1: geometry complete, with a ground plane present.
        'GE 1',
        `GN 2 0 0 0 ${soil.epsR} ${soil.sigmaSm}`,
        // EX 0: voltage source, 1 V on tag 1 segment 1, the feedpoint.
        'EX 0 1 1 0 1 0',
        `FR 0 ${sweep.points} 0 0 ${mhz(sweep.startHz)} ${mhz(sweep.stepHz)}`,
        // XQ: execute.  NEC-2 solves at an execution card, not at FR, and a
        // deck ending FR / EN computes nothing at all -- it prints the
        // geometry echo and stops.  XQ inside the sweep runs every frequency
        // and reports the feedpoint at each, which is what this page is about;
        // nec_model.py's fitting runs use the same card.
        'XQ',
        'EN',
      );
      return `${cards.join('\n')}\n`;
    };

    /**
     * AntennaSim project format: schema version, and the extension its Open
     * dialog accepts.
     *
     * Written because its .nec importer reads the ground card's type and
     * discards the constants, so an imported deck always simulates medium
     * soil however the page was set.  A project file carries them, and this
     * page's whole subject is what the ground does to the match.
     *
     * This is somebody else's format and nothing here can test it: the
     * version is theirs, the field names are theirs, and a schema change
     * upstream is a broken file with no warning from any check we run.  It is
     * written at version 2 deliberately -- their loader rejects a file
     * claiming to be newer than it understands, and accepts an older one.
     */
    const ANTENNASIM_SCHEMA_VERSION = 2;
    const ANTENNASIM_EXTENSION = 'antennasim';

    /**
     * The installation as an AntennaSim editor project.
     *
     * Same wires as the deck, plus the two things the deck cannot carry
     * across their importer: the soil constants, and the sweep as a range
     * rather than an FR card.
     *
     * `createdAt` is a parameter rather than read from the clock here, which
     * keeps this half of the page free of anything the tests cannot pin.
     *
     * @param {Meters} lenM
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {Meters} radiusM
     * @param {string} createdAt  ISO 8601
     * @returns {?string}  JSON, or null when there is nothing to sweep
     */
    const buildAntennaSimProject = (lenM, bands, segment, site, radiusM,
                                    createdAt) => {
      const sweep = deckSweep(bands, segment);
      if (sweep === null || lenM <= 0) return null;

      const soil = SOILS[site.soil];
      const stopHz = sweep.startHz + sweep.stepHz * (sweep.points - 1);
      const wires = deckWires(lenM, site, radiusM, C_SPEED / stopHz);
      // The pattern is drawn at one frequency, and the lowest selected band is
      // where a random wire is shortest against a wavelength and the ground
      // does the most to it.
      const designHz = (sweep.startHz + bandEdgesHz(
        bands.reduce((a, b) => (a.m > b.m ? a : b)), segment)[1]) / 2;

      return `${JSON.stringify({
        version: ANTENNASIM_SCHEMA_VERSION,
        app_version: 'random-wire.html',
        created_at: createdAt,
        mode: 'editor',
        editor: {
          wires,
          excitations: [{ wire_tag: 1, segment: 1, voltage_real: 1,
                          voltage_imag: 0 }],
          loads: [],
          transmissionLines: [],
          junctions: [],
          ground: {
            type: 'custom',
            custom_permittivity: soil.epsR,
            custom_conductivity: soil.sigmaSm,
          },
          frequencyRange: {
            start_mhz: sweep.startHz / 1e6,
            stop_mhz: stopHz / 1e6,
            steps: sweep.points,
          },
          designFrequencyMhz: designHz / 1e6,
        },
      }, null, 2)}\n`;
    };

    // ============================================================
    // Formatting
    // ============================================================

    /** @param {Meters} lenM @param {UnitKey} units @returns {number} */
    const toDisplay = (lenM, units) => lenM * UNITS[units].perMeter;

    /** @param {number} len  in display units @param {UnitKey} units @returns {Meters} */
    const fromDisplay = (len, units) => len / UNITS[units].perMeter;

    /** @param {Meters} lenM @param {UnitKey} units @returns {string} */
    const fmtLen = (lenM, units) => UNITS[units].format(lenM);

    /**
     * Band edges in kHz below 1 MHz, MHz above, so LF bands stay readable.
     * @param {Hertz} loHz
     * @param {Hertz} hiHz
     * @returns {string}
     */
    const fmtBandEdges = (loHz, hiHz) => hiHz < 1e6
      ? `${(loHz / 1e3).toFixed(1)}-${(hiHz / 1e3).toFixed(1)} kHz`
      : `${(loHz / 1e6).toFixed(3)}-${(hiHz / 1e6).toFixed(3)}`;

    /** Unit note for anything printed by fmtBandEdges, which labels only kHz. */
    const BAND_EDGE_UNIT_HINT = 'Frequencies in MHz unless marked';

    /**
     * Tick step in display units that yields roughly TARGET_TICKS ticks.
     * @param {number} spanDisplay
     * @returns {number}
     */
    const tickStep = (spanDisplay) => {
      const ideal = spanDisplay / TARGET_TICKS;
      return TICK_STEPS.find(step => step >= ideal) ?? TICK_STEPS[TICK_STEPS.length - 1];
    };

    // ============================================================
    // URL state
    // ============================================================

    /** @param {number} value @param {{min: number, max: number}} range */
    const clamp = (value, { min, max }) => Math.min(max, Math.max(min, value));

    /** @param {?string} raw @param {number} fallback @returns {number} */
    const parseNum = (raw, fallback) => {
      const value = parseFloat(raw ?? '');
      return Number.isFinite(value) ? value : fallback;
    };

    /**
     * Own properties only.  A bare `key in obj` also matches everything on
     * Object.prototype, so ?region=toString would pass the check and then
     * fail to resolve to a band plan.
     *
     * @template {Object} T
     * @param {T} obj
     * @param {?string} key
     * @returns {key is (string & keyof T)}
     */
    const isKeyOf = (obj, key) =>
      key !== null && Object.prototype.hasOwnProperty.call(obj, key);

    /**
     * Object.entries, keeping the key type.  The built-in widens keys to
     * string, which loses the union the state and lookups are typed on.
     *
     * @template {Object} T
     * @param {T} obj
     * @returns {[string & keyof T, T[string & keyof T]][]}
     */
    const entriesOf = (obj) => /** @type {any} */ (Object.entries(obj));

    /**
     * Wire length from either spelling, preferring the current one.
     * @param {URLSearchParams} params
     * @returns {Meters}
     */
    const readWireLenM = (params) => {
      const meters = params.get(URL_KEYS.wireLenM);
      if (meters !== null) return parseNum(meters, DEFAULTS.wireLenM);
      const feet = params.get(LEGACY_LEN_FT_KEY);
      return feet === null ? DEFAULTS.wireLenM : parseNum(feet, 0) / FT_PER_M;
    };

    // END PURE
    // Below here the page reads the document.  Everything above, including
    // the URL parsing, takes what it needs as an argument, so the legacy
    // ?len= guarantee can be tested rather than trusted.

    /**
     * Save text to a file, by way of a link the page clicks for itself.
     *
     * @param {string} text
     * @param {string} filename
     */
    const saveTextFile = (text, filename) => {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    };

    /**
     * File name for a deck, in metres regardless of the display unit: the
     * name is a file on disk rather than something being read off the page,
     * and one unit keeps a directory of them sortable.
     *
     * @param {Meters} lenM
     * @param {string} extension
     * @returns {string}
     */
    const deckFilename = (lenM, extension) =>
      `random-wire-${lenM.toFixed(2)}m.${extension}`;

    const getUrlParams = () => {
      const params = new URLSearchParams(window.location.search);
      const rawRegion = params.get(URL_KEYS.region);
      const region = isKeyOf(REGIONS, rawRegion) ? rawRegion : DEFAULTS.region;
      const rawBands = params.get(URL_KEYS.bands);
      const bands = rawBands === null
        ? DEFAULTS.bands
        : rawBands.split(',').map(Number).filter(m => bandsIn(region).some(b => b.m === m));
      const segment = params.get(URL_KEYS.segment);
      const units = params.get(URL_KEYS.units);
      const mode = params.get(URL_KEYS.mode);
      const ununRatio = parseNum(params.get(URL_KEYS.ununRatio), DEFAULTS.ununRatio);
      const soil = params.get(URL_KEYS.soil);
      const tuner = params.get(URL_KEYS.tuner);
      return {
        region,
        bands,
        segment: isKeyOf(SEGMENTS, segment) ? segment : DEFAULTS.segment,
        mode: isKeyOf(MODES, mode) ? mode : DEFAULTS.mode,
        // An unlisted ratio would leave the control with nothing selected.
        ununRatio: UNUN_RATIOS.includes(ununRatio) ? ununRatio : DEFAULTS.ununRatio,
        velocityFactor: clamp(
          parseNum(params.get(URL_KEYS.velocityFactor), DEFAULTS.velocityFactor),
          VELOCITY_FACTOR_RANGE),
        marginPct: clamp(parseNum(params.get(URL_KEYS.marginPct), DEFAULTS.marginPct),
                         MARGIN_PCT_RANGE),
        units: isKeyOf(UNITS, units) ? units : DEFAULTS.units,
        wireLenM: Math.max(0, readWireLenM(params)),
        heightM: clamp(parseNum(params.get(URL_KEYS.heightM), DEFAULTS.heightM),
                       HEIGHT_RANGE_M),
        returnM: clamp(parseNum(params.get(URL_KEYS.returnM), DEFAULTS.returnM),
                       RETURN_RANGE_M),
        soil: isKeyOf(SOILS, soil) ? soil : DEFAULTS.soil,
        tuner: isKeyOf(TUNERS, tuner) ? tuner : DEFAULTS.tuner,
      };
    };

    /**
     * A length the page chose on load counts as a default, so opening the page
     * fresh leaves a clean URL.
     */
    /**
     * @param {ReturnType<typeof getUrlParams>} state
     * @param {?Meters} autoLenM
     * @returns {boolean}
     */
    const isAtDefaults = (state, autoLenM) =>
      state.region === DEFAULTS.region &&
      state.segment === DEFAULTS.segment &&
      state.mode === DEFAULTS.mode &&
      state.ununRatio === DEFAULTS.ununRatio &&
      state.velocityFactor === DEFAULTS.velocityFactor &&
      state.marginPct === DEFAULTS.marginPct &&
      state.units === DEFAULTS.units &&
      state.heightM === DEFAULTS.heightM &&
      state.returnM === DEFAULTS.returnM &&
      state.soil === DEFAULTS.soil &&
      state.tuner === DEFAULTS.tuner &&
      (state.wireLenM === DEFAULTS.wireLenM || state.wireLenM === autoLenM) &&
      state.bands.length === DEFAULTS.bands.length &&
      DEFAULTS.bands.every(m => state.bands.includes(m));

    // ============================================================
    // Components
    // ============================================================

    /** Horizontal map of wire length: red where resonant, green where usable. */
    /**
     * @param {{solution: ReturnType<typeof solve>,
     *          score: ?ReturnType<typeof solveImpedance>,
     *          maxLenM: Meters, units: UnitKey,
     *          wireLenM: Meters, onPick: (lenM: Meters) => void}} props
     */
    function LengthMap({ solution, score, maxLenM, units, wireLenM, onPick }) {
      const [hoverM, setHoverM] = useState(/** @type {?Meters} */ (null));

      const plotWidth = MAP.width - MAP.left - MAP.right;
      /** @param {Meters} lenM @returns {number} SVG x */
      const xOf = (lenM) => MAP.left + (lenM / maxLenM) * plotWidth;

      /** @param {number} x  SVG x @returns {Meters} */
      const lenAt = (x) => ((x - MAP.left) / plotWidth) * maxLenM;

      const step = tickStep(toDisplay(maxLenM, units));
      const ticks = [];
      for (let value = 0; value <= toDisplay(maxLenM, units); value += step) {
        ticks.push(value);
      }

      /**
       * Length under the pointer, clamped to the map.
       * @param {React.MouseEvent<SVGSVGElement>} event
       * @returns {Meters}
       */
      const lenAtEvent = (event) => {
        const rect = event.currentTarget.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * MAP.width;
        return Math.max(0, Math.min(maxLenM, lenAt(x)));
      };

      /** @param {React.MouseEvent<SVGSVGElement>} event */
      const handleMove = (event) => setHoverM(lenAtEvent(event));

      const hoverHit = hoverM === null
        ? null
        : solution.avoid.find(a => hoverM >= a.lo && hoverM <= a.hi);

      const plotHeight = score === null ? MAP.barHeight : MAP.curveHeight;
      const barBottom = MAP.top + plotHeight;

      /** SWR plotted logarithmically: it is a ratio, and the range is wide. */
      const yOfSwr = (/** @type {number} */ swr) => barBottom - plotHeight
        * Math.min(1, Math.max(0, Math.log(swr) / Math.log(SWR_PLOT_MAX)));

      const curvePath = score === null ? '' : score.curve
        .map((point, i) => `${i === 0 ? 'M' : 'L'} ${xOf(point.lenM).toFixed(2)} `
          + `${yOfSwr(point.swr).toFixed(2)}`)
        .join(' ');

      /** The score under the pointer, for the readout. */
      const hoverScore = (score === null || hoverM === null) ? null
        : score.curve.reduce((best, point) =>
            Math.abs(point.lenM - hoverM) < Math.abs(best.lenM - hoverM) ? point : best,
          score.curve[0]);

      return (
        <div className="map-container">
          <svg className="map-svg" viewBox={`0 0 ${MAP.width} ${MAP.height}`}
               onMouseMove={handleMove} onMouseLeave={() => setHoverM(null)}
               onClick={(event) => onPick(lenAtEvent(event))}>
            <defs>
              {/* Diagonal hatch marks the too-short zone without relying on hue. */}
              <pattern id="hatch-short" width="8" height="8" patternUnits="userSpaceOnUse"
                       patternTransform="rotate(45)">
                <rect width="8" height="8" fill="#2a2a28" />
                <rect width="3" height="8" fill={COLORS.short} />
              </pattern>
            </defs>
            {/* Usable background */}
            {score === null && solution.usable.map((u, i) => (
              <rect key={`u${i}`} x={xOf(u.lo)} y={MAP.top}
                    width={Math.max(MIN_BAND_WIDTH, xOf(u.hi) - xOf(u.lo))}
                    height={plotHeight}
                    fill={COLORS.usable} stroke={COLORS.usableEdge} strokeWidth="0.5" />
            ))}
            {/* Lengths to avoid */}
            {score === null && solution.avoid.map((a, i) => (
              <rect key={`a${i}`} x={xOf(Math.max(0, a.lo))} y={MAP.top}
                    width={Math.max(MIN_BAND_WIDTH,
                                    xOf(Math.min(a.hi, maxLenM)) - xOf(Math.max(0, a.lo)))}
                    height={plotHeight}
                    fill={a.kind === 'short' ? 'url(#hatch-short)' : COLORS.avoid}
                    opacity={a.kind === 'short' ? 1 : 0.9} />
            ))}
            {/* Modelled SWR, with the too-short zone still marked */}
            {score !== null && (
              <g>
                <rect x={MAP.left} y={MAP.top}
                      width={Math.max(MIN_BAND_WIDTH, xOf(Math.min(score.shortLimit, maxLenM)) - MAP.left)}
                      height={plotHeight} fill="url(#hatch-short)" opacity="0.5" />
                {[2, 5, 10].map(swr => (
                  <g key={swr}>
                    <line x1={MAP.left} y1={yOfSwr(swr)} x2={MAP.width - MAP.right}
                          y2={yOfSwr(swr)} stroke={COLORS.axis} strokeWidth="0.5"
                          strokeDasharray="3 3" />
                    <text x={MAP.left + 6} y={yOfSwr(swr) - 4} fill={COLORS.label}
                          fontSize={MAP.tickFontSize} textAnchor="start"
                          fontFamily="monospace">{swr}:1</text>
                  </g>
                ))}
                <path d={curvePath} fill="none" stroke={COLORS.usableEdge}
                      strokeWidth="1.5" />
              </g>
            )}
            {/* Axis and ticks */}
            <line x1={MAP.left} y1={barBottom} x2={MAP.width - MAP.right} y2={barBottom}
                  stroke={COLORS.axis} strokeWidth="1" />
            {ticks.map((value) => {
              const x = xOf(fromDisplay(value, units));
              return (
                <g key={value}>
                  <line x1={x} y1={barBottom} x2={x} y2={barBottom + 5}
                        stroke={COLORS.axis} strokeWidth="1" />
                  <text x={x} y={barBottom + 24} fill={COLORS.label} fontSize={MAP.tickFontSize}
                        textAnchor="middle" fontFamily="monospace">{value}</text>
                </g>
              );
            })}
            <text x={MAP.width / 2} y={MAP.height - 4} fill={COLORS.label} fontSize={MAP.axisFontSize}
                  textAnchor="middle" fontFamily="monospace">
              wire length ({UNITS[units].axisLabel})
            </text>
            {/* Selected length marker */}
            {wireLenM > 0 && wireLenM <= maxLenM && (
              <line x1={xOf(wireLenM)} y1={MAP.top - 6} x2={xOf(wireLenM)} y2={barBottom + 3}
                    stroke={COLORS.marker} strokeWidth="2" />
            )}
            {hoverM !== null && (
              <line x1={xOf(hoverM)} y1={MAP.top} x2={xOf(hoverM)} y2={barBottom}
                    stroke="#fff" strokeWidth="1" opacity="0.5" />
            )}
          </svg>
          <div className="map-readout">
            {hoverM === null
              ? 'Click the map to set the wire length.'
              : score !== null && hoverScore
                ? `${fmtLen(hoverM, units)} - SWR ${hoverScore.swr.toFixed(1)}:1 typical, `
                  + `worst ${hoverScore.worst.swr.toFixed(1)}:1 on ${hoverScore.worst.band.label}`
                : `${fmtLen(hoverM, units)} - ${hoverHit ? `avoid: ${hoverHit.label}` : 'usable'}`}
          </div>
          <div className="map-legend">
            {score === null ? (
              <>
                <span><span className="swatch" style={{ background: COLORS.avoid }}></span>
                  near a half-wave resonance</span>
                <span><span className="swatch swatch-hatch"></span>
                  shorter than λ/4</span>
                <span><span className="swatch" style={{ background: COLORS.usable,
                  boxShadow: `inset 0 0 0 1px ${COLORS.usableEdge}` }}></span>usable</span>
              </>
            ) : (
              <>
                <span><span className="swatch" style={{ background: COLORS.usableEdge }}></span>
                  modelled SWR at the radio, lower is better</span>
                <span><span className="swatch swatch-hatch"></span>
                  shorter than λ/4</span>
              </>
            )}
            <span><span className="swatch" style={{ background: COLORS.marker }}></span>
              your wire</span>
          </div>
        </div>
      );
    }

    function RandomWire() {
      const [p, setP] = useState(getUrlParams);

      /**
       * Stable across renders so effects can depend on it honestly: a fresh
       * closure each render would make any effect listing it run every time.
       *
       * @param {Partial<ReturnType<typeof getUrlParams>>} updates
       */
      const set = useCallback(
        /** @param {Partial<ReturnType<typeof getUrlParams>>} updates */
        (updates) => setP(prev => ({ ...prev, ...updates })), []);

      const { region, bands, segment, velocityFactor, marginPct, units, wireLenM,
              mode, ununRatio, heightM, returnM, soil, tuner } = p;

      /**
       * The return conductor cannot be shorter than the drop it starts with,
       * so a return below the wire height is not a geometry that exists.
       * Clamped rather than rejected: the height slider can be dragged above
       * a previously chosen return, and silently modelling a negative run
       * would be worse than quietly holding the floor.
       *
       * @type {Meters}
       */
      const effectiveReturnM = Math.max(returnM, heightM);

      /** @type {Site} */
      const site = useMemo(
        () => ({ heightM, returnM: Math.max(returnM, heightM), soil }),
        [heightM, returnM, soil]);

      /**
       * The velocity factor whatever is on screen should be drawn against.
       *
       * The classical mode's keep-out zones are arithmetic on the user's own
       * velocity factor, so they follow it.  The impedance mode does not use
       * that number at all: its coefficients were fitted with the antenna
       * line at MODEL_VF_A, so half waves drawn at anything else would sit
       * beside peaks the model puts somewhere else.
       */
      const displayVf = mode === 'impedance' ? MODEL_VF_A : velocityFactor;

      // Map spans one full wavelength at the lowest selected band, which is the
      // longest wire worth considering for that band.
      const maxLenM = useMemo(() => {
        const selected = bandsIn(region).filter(b => bands.includes(b.m));
        if (selected.length === 0) return EMPTY_MAP_LEN_M;
        const lowestHz = Math.min(...selected.map(b => bandEdgesHz(b, segment)[0]));
        return 2 * halfWaveM(lowestHz, displayVf);
      }, [region, bands, segment, displayVf]);

      /**
       * A quarter wave at the lowest selected band, which is the counterpoise
       * length the ARRL specifies, offered as a preset beside the typical
       * coax run.  Null when no band is selected, or when a quarter wave is
       * longer than the control can express.
       */
      const [lowestBandM, quarterWaveReturnM] = useMemo(() => {
        const selected = bandsIn(region).filter(b => bands.includes(b.m));
        if (selected.length === 0) return [0, null];
        const lowest = selected.reduce((a, b) => (a.m > b.m ? a : b));
        const quarterM = halfWaveM(bandEdgesHz(lowest, segment)[0], MODEL_VF_A) / 2;
        return [lowest.m, quarterM > RETURN_RANGE_M.max ? null : quarterM];
      }, [region, bands, segment]);

      // units is a dependency because a recommended length is rounded to a
      // round number in whatever unit it will be read in.
      const solution = useMemo(
        () => solve(region, bands, segment, velocityFactor, marginPct, maxLenM, units),
        [region, bands, segment, velocityFactor, marginPct, maxLenM, units]);

      const score = useMemo(
        () => (mode === 'impedance'
          ? solveImpedance(region, bands, segment, site, WIRE_RADIUS_M,
                           ununRatio, maxLenM, units)
          : null),
        [mode, region, bands, segment, site, ununRatio, maxLenM, units]);

      /**
       * The published table lengths, scored by the model, so a length the
       * page declines to recommend is visibly considered rather than absent.
       */
      const publishedScores = useMemo(
        () => (mode === 'impedance' && solution.bands.length > 0
          ? PUBLISHED_FT.map(ft => {
            const lenM = fromDisplay(ft, 'ft');
            const scored = scoreLength(lenM, solution.bands, segment, site,
                                       WIRE_RADIUS_M, ununRatio);
            return { ft, lenM, scored };
          })
          : []),
        [mode, solution, segment, site, ununRatio]);

      /** Fraction of the map the classical rule leaves usable, as a percent. */
      const usablePct = useMemo(
        () => (maxLenM > 0
          ? Math.round(100 * solution.usable.reduce(
            (sum, span) => sum + (span.hi - span.lo), 0) / maxLenM)
          : 0),
        [solution, maxLenM]);

      /**
       * What the classical clearance is worth, priced by the impedance model.
       * Only computed in classical mode, where the number is otherwise a bare
       * percentage; the impedance mode already speaks this currency.
       */
      const marginWorstSwr = useMemo(
        () => (mode === 'classical' && solution.bands.length > 0
          ? worstSuggestedSwr(solution.suggestions, solution.bands, segment,
                              site, ununRatio)
          : null),
        [mode, solution, segment, site, ununRatio]);

      /** Modelled SWR for the length in hand, for the verdict line. */
      const scoreHere = useMemo(
        () => (mode === 'impedance' && wireLenM > 0 && solution.bands.length > 0
          ? scoreLength(wireLenM, solution.bands, segment, site,
                        WIRE_RADIUS_M, ununRatio)
          : null),
        [mode, wireLenM, solution, segment, site, ununRatio]);

      /**
       * The deck for the length in hand.  Impedance mode only: the geometry
       * it describes is the height, return path and soil, and those controls
       * only exist in that mode, so a deck offered beside the classical rule
       * would be built from numbers the user was never shown.
       */
      const deck = useMemo(
        () => (mode === 'impedance'
          ? buildNecDeck(wireLenM, solution.bands, segment, site, WIRE_RADIUS_M)
          : null),
        [mode, wireLenM, solution, segment, site]);

      const saveDeck = () => {
        if (deck !== null) saveTextFile(deck, deckFilename(wireLenM, 'nec'));
      };

      // Built on click rather than in a memo: it carries a timestamp, and one
      // that ages with the render would make the file differ from itself.
      const saveAntennaSimProject = () => {
        if (deck === null) return;
        const project = buildAntennaSimProject(
          wireLenM, solution.bands, segment, site, WIRE_RADIUS_M,
          new Date().toISOString());
        if (project !== null) {
          saveTextFile(project, deckFilename(wireLenM, ANTENNASIM_EXTENSION));
        }
      };

      // Only searched when the asked-for margin leaves nothing.
      const fallback = useMemo(
        () => (solution.suggestions.length > 0 || bands.length === 0
          ? null
          : bestFeasibleMargin(region, bands, segment, velocityFactor, marginPct,
                               maxLenM, units)),
        [solution, region, bands, segment, velocityFactor, marginPct, maxLenM, units]);

      const clearLength = useMemo(
        () => nearestClearLength(wireLenM, solution.usable, units),
        [wireLenM, solution, units]);

      const verdict = useMemo(
        () => judgeLength(wireLenM, solution.bands, segment, velocityFactor,
                          marginPct, solution.shortLimit),
        [wireLenM, solution, segment, velocityFactor, marginPct]);

      // Jump to the best length whenever the inputs change, so the answer
      // always suits the current selection.  Typing a length or picking one
      // off the map leaves the solution alone, so those stick until an input
      // changes.  A length in the URL wins on first load.
      //
      // The dependencies are the physical inputs rather than the derived
      // solution and score.  Those two are rebuilt when `units` changes, since
      // a recommendation is rounded in the unit it will be read in, and
      // depending on them meant switching feet to metres silently replaced a
      // length the user had typed or clicked.  Nothing physical changes when
      // the unit does.
      const autoLenM = useRef(/** @type {?Meters} */ (null));
      const firstRun = useRef(true);
      const bestLenM = mode === 'impedance'
        ? (score ? score.suggestions[0]?.lenM : undefined)
        : solution.suggestions[0]?.pick;

      /**
       * What the recommendation actually depends on, as one comparable value.
       * The display unit is deliberately absent: it re-rounds a pick but
       * changes no physics, and treating it as an input is what let a unit
       * switch discard a length the user had typed.
       */
      const inputSignature = [region, bands.join(','), segment, mode, heightM,
                              returnM, soil, ununRatio, velocityFactor,
                              marginPct].join('|');
      const lastSignature = useRef(inputSignature);

      useEffect(() => {
        const wasFirstRun = firstRun.current;
        const changed = lastSignature.current !== inputSignature;
        firstRun.current = false;
        lastSignature.current = inputSignature;
        if (bestLenM === undefined) return;
        // A length in the URL wins on first load.
        if (wasFirstRun && wireLenM > 0) return;
        // After that, only a real input change moves a length the user set;
        // a page-chosen length is re-rounded whenever the unit changes.
        const userChose = autoLenM.current === null || wireLenM !== autoLenM.current;
        if (!wasFirstRun && !changed && userChose) return;
        if (bestLenM === wireLenM) return;
        autoLenM.current = bestLenM;
        set({ wireLenM: bestLenM });
      }, [inputSignature, bestLenM, wireLenM, set]);

      useEffect(() => {
        if (isAtDefaults(p, autoLenM.current)) {
          window.history.replaceState(null, '', window.location.pathname);
          return;
        }
        // Read from `p` rather than the destructured locals, so the single
        // dependency below is honestly the whole of what this writes.
        const params = new URLSearchParams();
        params.set(URL_KEYS.region, p.region);
        params.set(URL_KEYS.bands, p.bands.join(','));
        params.set(URL_KEYS.segment, p.segment);
        params.set(URL_KEYS.mode, p.mode);
        params.set(URL_KEYS.ununRatio, String(p.ununRatio));
        params.set(URL_KEYS.velocityFactor, String(p.velocityFactor));
        params.set(URL_KEYS.heightM, String(p.heightM));
        params.set(URL_KEYS.returnM, String(p.returnM));
        params.set(URL_KEYS.soil, p.soil);
        params.set(URL_KEYS.tuner, p.tuner);
        params.set(URL_KEYS.marginPct, String(p.marginPct));
        params.set(URL_KEYS.units, p.units);
        if (p.wireLenM > 0) params.set(URL_KEYS.wireLenM, p.wireLenM.toFixed(3));
        window.history.replaceState(null, '', `${window.location.pathname}?${params}`);
      }, [p]);

      /** @param {number} m  band wavelength in meters */
      const toggleBand = (m) => set({
        bands: bands.includes(m) ? bands.filter(x => x !== m) : [...bands, m].sort((a, b) => b - a),
      });

      /**
       * Switching region drops any selected band that region does not have.
       * @param {RegionKey} key
       */
      const setRegion = (key) => set({
        region: key,
        bands: bands.filter(m => bandsIn(key).some(b => b.m === m)),
      });

      /** @param {Meters} lenM */
      const setWireLen = (lenM) => {
        if (!Number.isFinite(lenM)) return;
        set({ wireLenM: Math.max(0,
          fromDisplay(Number(toDisplay(lenM, units).toFixed(2)), units)) });
      };

      /**
       * What the length field shows while it is being typed in.  A controlled
       * field formatted on every keystroke fights the user: a partial number
       * like "5." reformats to "5.00" mid-entry, and an empty field or a
       * stray character parses to NaN.  The draft holds whatever was typed
       * until focus leaves, and only finite values reach the model.
       */
      const [lenDraft, setLenDraft] = useState(/** @type {?string} */ (null));
      const lenShown = lenDraft ?? toDisplay(wireLenM, units).toFixed(2);

      const noBands = bands.length === 0;

      return (
        <div className="app">
          {mode === 'impedance' && (
            <div className="ribbon"><span>EXPERIMENTAL</span></div>
          )}
          <h1 className="title">Random Wire Antenna Length Calculator</h1>
          <div className="footer">
            End-fed wire lengths that dodge half-wave resonances on the bands you pick
          </div>

          <div className="main-content">
            <div className="column">
              <div className="panel">
                <div className="panel-header">Method</div>
                <div className="segment-toggle" role="radiogroup" aria-label="Method">
                  {entriesOf(MODES).map(([key, def]) => (
                    <button key={key}
                            className={`btn segment-btn ${mode === key ? 'active' : ''}`}
                            role="radio" aria-checked={mode === key}
                            onClick={() => set({ mode: key })}>
                      {def.label}
                    </button>
                  ))}
                </div>
                <div className="control-hint">{MODES[mode].note}</div>
              </div>

              <div className="panel">
                <div className="panel-header">Band plan</div>
                <div className="presets" role="radiogroup" aria-label="Band plan">
                  {entriesOf(REGIONS).map(([key, def]) => (
                    <button key={key}
                            className={`btn preset-btn ${region === key ? 'active' : ''}`}
                            role="radio" aria-checked={region === key}
                            onClick={() => setRegion(key)}>
                      {def.label}
                    </button>
                  ))}
                </div>
                <div className="control-hint">{REGIONS[region].note}</div>
              </div>

              <div className="panel">
                <div className="panel-header">Bands of interest</div>
                <div className="presets">
                  {PRESETS.map(preset => (
                    <button key={preset.label} className="btn preset-btn"
                            onClick={() => set({ bands: [...preset.bands] })}>
                      {preset.label}
                    </button>
                  ))}
                </div>
                <div className="segment-toggle" role="radiogroup" aria-label="Segment">
                  {entriesOf(SEGMENTS).map(([key, def]) => (
                    <button key={key}
                            className={`btn segment-btn ${segment === key ? 'active' : ''}`}
                            role="radio" aria-checked={segment === key}
                            onClick={() => set({ segment: key })}>
                      {def.label}
                    </button>
                  ))}
                </div>
                <div className="band-grid">
                  {bandsIn(region).map(band => {
                    const [lo, hi] = bandEdgesHz(band, segment);
                    return (
                      <button key={band.m}
                              className={`btn band-btn ${bands.includes(band.m) ? 'active' : ''}`}
                              aria-pressed={bands.includes(band.m)}
                              onClick={() => toggleBand(band.m)}>
                        {band.label}
                        <span className="band-freq">{fmtBandEdges(lo, hi)}</span>
                      </button>
                    );
                  })}
                </div>
                <div className="control-hint right">{BAND_EDGE_UNIT_HINT}</div>
              </div>

              <div className="panel">
                <div className="panel-header">Display</div>
                <fieldset className="control-group" role="radiogroup">
                  <legend>Units</legend>
                  {entriesOf(UNITS).map(([key, def]) => (
                    <button key={key}
                            className={`btn preset-btn ${units === key ? 'active' : ''}`}
                            role="radio" aria-checked={units === key}
                            onClick={() => set({ units: key })}>
                      {def.label}
                    </button>
                  ))}
                </fieldset>
              </div>

              <div className="panel">
                <div className="panel-header">
                  {mode === 'impedance' ? 'Your installation' : 'Rule parameters'}
                </div>
                {mode === 'impedance' && (
                  <div className="control-hint" style={{ marginBottom: '10px' }}>
                    Fitted against NEC over
                    {' '}{MODEL_FIT_RANGE_HZ.min / 1e6}&ndash;
                    {MODEL_FIT_RANGE_HZ.max / 1e6} MHz, #14 AWG, counterpoise on
                    the ground.
                    |Z| typically within {MODEL_TYPICAL_FACTOR}x, and within
                    {' '}{MODEL_BOUND_FACTOR}x nine times in ten &mdash; not a
                    cap, and worse for a low wire or a raised counterpoise. An
                    envelope, not a prediction for your site.
                  </div>
                )}
                {mode === 'impedance' && (
                  <div className="control-label">
                    Wire gauge: <span className="control-value">
                      {WIRE_GAUGE_LABEL}</span>
                    <div className="control-hint">
                      Not adjustable yet. The fit holds from {WIRE_GAUGE_RANGE_LABEL},
                      into {Z_SYSTEM_OHMS} ohms at the radio.
                    </div>
                  </div>
                )}
                {mode === 'impedance' && (
                  <label className="control-label">
                    Wire height: <span className="control-value">
                      {fmtLen(heightM, units)}</span>
                    <input className="control-slider" type="range"
                           min={HEIGHT_RANGE_M.min} max={HEIGHT_RANGE_M.max}
                           step={HEIGHT_STEP_M}
                           value={heightM}
                           onChange={(e) => set({
                             heightM: clamp(Number(e.target.value),
                                            HEIGHT_RANGE_M) })} />
                    <div className="control-hint">
                      Height of the horizontal run. It matters most when the wire is
                      low in wavelengths, which on 160 m and 80 m means most
                      installations.
                    </div>
                  </label>
                )}
                {mode === 'impedance' && (
                  <label className="control-label">
                    Counterpoise / return: <span className="control-value">
                      {fmtLen(effectiveReturnM, units)}</span>
                    {/* Floor the travel at the drop rather than letting the
                        lower part of it move without changing anything. */}
                    <input className="control-slider" type="range"
                           min={Math.max(RETURN_RANGE_M.min, heightM)}
                           max={RETURN_RANGE_M.max}
                           step={RETURN_STEP_M}
                           value={effectiveReturnM}
                           onChange={(e) => set({
                             returnM: clamp(Number(e.target.value),
                                            RETURN_RANGE_M) })} />
                    <div className="preset-row">
                      {quarterWaveReturnM !== null && (
                        <button className="btn preset-btn"
                                onClick={() => set({ returnM: quarterWaveReturnM })}>
                          &#955;/4 on {lowestBandM} m
                        </button>
                      )}
                    </div>
                    <div className="control-hint">
                      Coax shield or counterpoise wire, whichever returns the
                      current &mdash; measured from the feedpoint, so the drop
                      down counts. Matters as much as the wire length.
                    </div>
                  </label>
                )}
                {mode === 'impedance' && (
