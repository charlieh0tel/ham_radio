<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Wire Antenna Length Calculator</title>
  <meta name="description" content="Pick end-fed random wire lengths that avoid half-wave resonances on the US ham bands you care about.">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; }

    /* Layout */
    .app {
      min-height: 100vh;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: "JetBrains Mono", "SF Mono", Monaco, Consolas, monospace;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .title {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #fff;
      margin: 0;
      text-transform: uppercase;
      text-align: center;
    }

    .main-content {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1 1 320px;
      min-width: 300px;
    }

    .column-wide {
      flex: 2 1 560px;
    }

    /* Panels */
    .panel {
      background: #1a1a1a;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .panel-header {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn:focus-visible {
      outline: 2px solid #4dabf7;
      outline-offset: 2px;
    }

    .presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .preset-btn {
      padding: 6px 12px;
      background: #111;
      color: #888;
      border: 1px solid #333;
      font-size: 11px;
      font-weight: 400;
    }

    .preset-btn:hover { color: #fff; border-color: #555; }

    .preset-btn.active { background: #333; color: #fff; border-color: #555; }

    /* Band selector */
    .band-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 6px;
    }

    .band-btn {
      padding: 8px 6px;
      background: #111;
      border: 1px solid #333;
      color: #777;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .band-btn.active {
      background: #12403a;
      border-color: #009e73;
      color: #4fd1ab;
    }

    .band-btn .band-freq {
      display: block;
      font-size: 9px;
      color: #666;
      font-weight: 400;
    }

    .band-btn.active .band-freq { color: #2aa383; }

    /* Segment toggle */
    .segment-toggle {
      display: flex;
      gap: 6px;
      background: #111;
      padding: 4px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .segment-btn {
      flex: 1;
      padding: 6px 10px;
      background: transparent;
      color: #777;
      font-size: 11px;
    }

    .segment-btn.active { background: #333; color: #fff; }

    /* Controls */
    .control-label {
      display: block;
      margin-bottom: 10px;
      font-size: 12px;
      color: #888;
    }

    .control-label:last-child { margin-bottom: 0; }

    .control-value { color: #fff; }

    .control-slider { width: 100%; margin-top: 4px; }

    .control-hint {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    .control-hint.right { text-align: right; margin-top: 8px; }

    .num-input {
      width: 80px;
      padding: 4px 6px;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 12px;
    }

    .num-input:focus { outline: none; border-color: #555; }

    .len-input {
      width: 100px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      padding: 2px 6px;
    }

    /* Length map */
    .map-container {
      background: #111;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #333;
    }

    .map-svg { display: block; width: 100%; }

    .map-readout {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
      min-height: 16px;
    }

    .map-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 10px;
      color: #666;
      margin-top: 8px;
    }

    .swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: -1px;
    }

    .swatch-hatch {
      background: repeating-linear-gradient(45deg, #8c8c88 0 2px, #2a2a28 2px 5px);
    }

    /* Verdict */
    .verdict {
      padding: 12px 14px;
      border-radius: 8px;
      border: 2px solid #333;
      background: #1a1a1a;
    }

    .verdict.good { background: #0d2621; border-color: #009e73; }
    .verdict.bad { background: #2b1409; border-color: #d55e00; }

    .verdict-headline {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .verdict-detail { font-size: 11px; color: #aaa; line-height: 1.6; }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      text-align: right;
      font-size: 10px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 6px;
      border-bottom: 1px solid #333;
    }

    th:first-child, td:first-child { text-align: left; }

    td {
      text-align: right;
      padding: 4px 6px;
      color: #aaa;
      border-bottom: 1px solid #222;
    }

    tr.pick td { cursor: pointer; }
    tr.pick:hover td { background: #222; color: #fff; }

    .best-length { color: #4fd1ab; font-weight: 600; }

    .empty-note { font-size: 11px; color: #666; }

    .link-btn {
      background: transparent;
      color: #4fd1ab;
      font-size: 11px;
      font-weight: 600;
      padding: 0;
      text-decoration: underline;
    }

    /* Info and footer */
    .info {
      max-width: 780px;
      font-size: 12px;
      color: #666;
      line-height: 1.7;
    }

    .info strong { color: #aaa; }
    .info a { color: #888; }

    .footer {
      font-size: 11px;
      color: #555;
      text-align: center;
    }

    .footer a { color: #888; }

    @media (max-width: 800px) {
      .app { padding: 16px; gap: 16px; }
      .column, .column-wide { min-width: unset; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ============================================================
    // Constants
    // ============================================================

    /** Speed of light, m/s. */
    const C_SPEED = 299792458;

    /** Feet per meter (exact, by definition of the international foot). */
    const FT_PER_M = 1 / 0.3048;

    /**
     * Amateur band edges in kHz, per region.
     *   m:     band wavelength in meters, the key used everywhere else
     *   full:  whole band
     *   cw:    CW / narrowband segment
     * National rules vary inside each IARU region; the region entries follow
     * the IARU band plans, and the US entry follows FCC allocations.
     * The shape is left to inference so that the region keys stay a literal
     * union; an Object<string, ...> annotation would widen them to string and
     * let a bad ?region= through the lookup.
     */
    const REGIONS = Object.freeze({
      us: {
        label: 'United States',
        note: '47 CFR 97.301, per the ARRL frequency chart. Includes the 60m '
          + 'rules effective 13 Feb 2026.',
        bands: [
          // 2200m and 630m were allocated in 2017; both are secondary and
          // power limited, but the half-wave lengths still apply.
          { m: 2200, label: '2200m', full: [135.7e3, 137.8e3],   cw: [135.7e3, 137.8e3] },
          { m: 630,  label: '630m',  full: [472e3, 479e3],       cw: [472e3, 479e3] },
          { m: 160,  label: '160m',  full: [1.8e6, 2e6],         cw: [1.8e6, 1.84e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 4e6],         cw: [3.5e6, 3.6e6] },
          // Since 13 Feb 2026: the 5351.5-5366.5 kHz band at 9.15 W ERP, plus
          // four retained 2.8 kHz channels centered on 5332, 5348, 5373 and
          // 5405 kHz at 100 W ERP.  The span below covers all of it.
          { m: 60,   label: '60m',   full: [5.3306e6, 5.4064e6], cw: [5.3306e6, 5.4064e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.3e6],         cw: [7e6, 7.125e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.15e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.15e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.11e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.2e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.93e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.3e6] },
          { m: 6,    label: '6m',    full: [50e6, 54e6],         cw: [50e6, 50.1e6] },
        ],
      },
      r1: {
        label: 'IARU Region 1',
        note: 'Europe, Africa, Middle East, northern Asia. 6m upper edge varies by country.',
        bands: [
          { m: 2200, label: '2200m', full: [135.7e3, 137.8e3],   cw: [135.7e3, 137.8e3] },
          { m: 630,  label: '630m',  full: [472e3, 479e3],       cw: [472e3, 479e3] },
          { m: 160,  label: '160m',  full: [1.81e6, 2e6],        cw: [1.81e6, 1.838e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 3.8e6],       cw: [3.5e6, 3.57e6] },
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.354e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.2e6],         cw: [7e6, 7.04e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.13e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.07e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.095e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.07e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.915e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.07e6] },
          { m: 6,    label: '6m',    full: [50e6, 52e6],         cw: [50e6, 50.1e6] },
        ],
      },
      r2: {
        label: 'IARU Region 2',
        note: 'The Americas. National allocations differ; the US entry is more specific.',
        bands: [
          { m: 2200, label: '2200m', full: [135.7e3, 137.8e3],   cw: [135.7e3, 137.8e3] },
          { m: 630,  label: '630m',  full: [472e3, 479e3],       cw: [472e3, 479e3] },
          { m: 160,  label: '160m',  full: [1.8e6, 2e6],         cw: [1.8e6, 1.84e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 4e6],         cw: [3.5e6, 3.58e6] },
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.354e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.3e6],         cw: [7e6, 7.05e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.13e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.07e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.095e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.07e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.915e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.07e6] },
          { m: 6,    label: '6m',    full: [50e6, 54e6],         cw: [50e6, 50.1e6] },
        ],
      },
      r3: {
        label: 'IARU Region 3',
        note: 'Asia-Pacific. 80m and 40m upper edges vary widely by country.',
        bands: [
          { m: 2200, label: '2200m', full: [135.7e3, 137.8e3],   cw: [135.7e3, 137.8e3] },
          { m: 630,  label: '630m',  full: [472e3, 479e3],       cw: [472e3, 479e3] },
          { m: 160,  label: '160m',  full: [1.8e6, 2e6],         cw: [1.8e6, 1.84e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 3.9e6],       cw: [3.5e6, 3.54e6] },
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.354e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.3e6],         cw: [7e6, 7.04e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.13e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.07e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.095e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.07e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.915e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.07e6] },
          { m: 6,    label: '6m',    full: [50e6, 54e6],         cw: [50e6, 50.1e6] },
        ],
      },
    });

    /**
     * Units carried by the numbers below.  These are aliases, not distinct
     * types, so they document intent without forcing a cast at every step of
     * a calculation; the checker still catches a length passed where a
     * frequency belongs only where the alias appears in a signature.
     *
     * @typedef {number} Meters
     * @typedef {number} Hertz
     */

    /**
     * @typedef {Object} Band
     * @property {number} m      band wavelength in meters, the key used elsewhere
     * @property {string} label
     * @property {Hertz[]} full  whole-band edges, low first
     * @property {Hertz[]} cw    CW / narrowband segment edges
     *
     * @typedef {keyof typeof REGIONS} RegionKey
     * @typedef {keyof typeof SEGMENTS} SegmentKey
     * @typedef {keyof typeof UNITS} UnitKey
     *
     * A length interval to keep away from, and why.
     * @typedef {Object} Interval
     * @property {Meters} lo
     * @property {Meters} hi
     * @property {string} [label]
     * @property {string} [kind]
     *
     * A clear span, with the length to recommend inside it.
     * @typedef {Object} Span
     * @property {Meters} lo
     * @property {Meters} hi
     * @property {Meters} pick
     * @property {Meters} clearance
     */

    /**
     * Bands available in a region.
     * @param {RegionKey} region
     * @returns {Band[]}
     */
    const bandsIn = (region) => REGIONS[region].bands;

    /** Band-selection presets, by band wavelength in meters. */
    const PRESETS = Object.freeze([
      { label: 'HF all',   bands: [160, 80, 60, 40, 30, 20, 17, 15, 12, 10] },
      { label: 'Classic',  bands: [80, 40, 20, 15, 10] },
      { label: 'WARC',     bands: [30, 17, 12] },
      { label: '40-10',    bands: [40, 30, 20, 17, 15, 12, 10] },
      { label: 'Clear',    bands: [] },
    ]);

    /** Wire-end-effect / velocity factor of a thin wire in free space. */
    const DEFAULT_VELOCITY_FACTOR = 0.95;

    /** Default clearance to keep from a half-wave resonance, percent of length. */
    const DEFAULT_MARGIN_PCT = 5;

    /** Range the velocity factor is held to; outside it the math degenerates. */
    const VELOCITY_FACTOR_RANGE = Object.freeze({ min: 0.5, max: 1 });

    /** Range the clearance margin is held to, percent of a half wavelength. */
    const MARGIN_PCT_RANGE = Object.freeze({ min: 0, max: 15 });

    /** Number of best-length suggestions listed. */
    const MAX_SUGGESTIONS = 8;

    /** Below this, a length displays fine at one decimal, in display units. */
    const LEN_ROUNDING_SLOP = 0.005;

    /** Inches per foot, and the decimals kept on the inches part. */
    const INCHES_PER_FT = 12;
    const INCH_DIGITS = 1;

    /** Narrowest a map band may be drawn, SVG units, so hairlines stay visible. */
    const MIN_BAND_WIDTH = 0.5;

    /** Map length used when no band is selected and there is nothing to scale to. */
    const EMPTY_MAP_LEN_M = 30;

    /**
     * Roundings tried for a recommended length, coarsest first, in whatever
     * unit the user is reading.  Roundness is a property of the number on
     * screen, not of the metre it is stored in: someone cutting wire to a tape
     * marked in feet wants a round number of feet.
     */
    const PICK_STEPS = Object.freeze([1, 0.5, 0.1, 0.01]);

    /** Step of the clearance margin slider, percent. */
    const MARGIN_STEP_PCT = 0.5;

    /** Bisection steps used to find the largest workable clearance margin. */
    const MARGIN_SEARCH_STEPS = 20;

    /** Length map geometry, SVG user units. */
    const MAP = Object.freeze({
      width: 1000, height: 150,
      left: 8, right: 8, top: 10,
      barHeight: 62,
      tickFontSize: 18,
      axisFontSize: 16,
    });

    /** Tick spacings tried, in display units, smallest first. */
    const TICK_STEPS = Object.freeze([1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000]);

    /** Target number of x-axis ticks. */
    const TARGET_TICKS = 12;

    /**
     * Okabe-Ito colorblind-safe palette.  The two kinds of excluded length are
     * also distinguished by fill pattern, so hue is never the only cue.
     */
    const COLORS = Object.freeze({
      avoid: '#d55e00',      // vermillion: near a half-wave resonance
      short: '#8c8c88',      // neutral gray, hatched: shorter than lambda/4 (see note)
      usable: '#12403a',
      usableEdge: '#009e73', // bluish green
      marker: '#f0e442',     // yellow
      axis: '#555',
      label: '#888',
    });

    /**
     * Renders a length as a decimal in some display unit.  One decimal place
     * normally, two when one would round the value somewhere it is not: a pick
     * of 75.96 ft shown as "76.0" names a length the page reports as one to
     * avoid, and a clearance of 0.04 ft shown as "0.0" reads as none at all.
     *
     * @param {string} abbrev
     * @param {number} perMeter  display units per metre
     * @returns {(lenM: Meters) => string}
     */
    const decimalLength = (abbrev, perMeter) => (lenM) => {
      const value = lenM * perMeter;
      const digits = Math.abs(Number(value.toFixed(1)) - value) < LEN_ROUNDING_SLOP ? 1 : 2;
      return `${value.toFixed(digits)} ${abbrev}`;
    };

    /**
     * Renders a length as feet and inches, for marking out wire with a
     * tape measure.  Inches keep a decimal place: rounding to a whole inch
     * would blur a length by up to 0.04 ft, which is more than the clearance
     * some spans have.
     *
     * @param {Meters} lenM
     * @returns {string}
     */
    const feetAndInches = (lenM) => {
      // Round before splitting, so 11.97 in becomes 1 ft 0.0 in, not 0 ft 12.0 in.
      const totalInches =
        Number((lenM * FT_PER_M * INCHES_PER_FT).toFixed(INCH_DIGITS));
      const feet = Math.floor(totalInches / INCHES_PER_FT);
      const inches = totalInches - feet * INCHES_PER_FT;
      if (inches === 0) return `${feet} ft`;
      return `${feet} ft ${inches.toFixed(INCH_DIGITS)} in`;
    };

    /**
     * Display units.
     *   label:     button text
     *   abbrev:    suffix on the length input, which is always decimal
     *   axisLabel: unit of the map's tick numbers, which are always decimal
     *   perMeter:  scale from metres, for the input, slider and map ticks
     *   format:    renders a length in metres as text
     * Feet and inches shares its scale with feet, differing only in format,
     * so the input and the map stay decimal while readouts carry inches.
     */
    const UNITS = Object.freeze({
      ft: { label: 'feet', abbrev: 'ft', axisLabel: 'feet', perMeter: FT_PER_M,
            format: decimalLength('ft', FT_PER_M) },
      ftin: { label: 'ft + in', abbrev: 'ft', axisLabel: 'feet', perMeter: FT_PER_M,
              format: feetAndInches },
      m: { label: 'meters', abbrev: 'm', axisLabel: 'meters', perMeter: 1,
           format: decimalLength('m', 1) },
    });

    const SEGMENTS = Object.freeze({
      full: { label: 'Whole band', key: /** @type {'full'} */ ('full') },
      cw:   { label: 'CW only', key: /** @type {'cw'} */ ('cw') },
    });

    const URL_KEYS = Object.freeze({
      region: 'region', bands: 'bands', segment: 'seg', velocityFactor: 'vf',
      marginPct: 'margin', units: 'u', wireLenM: 'len_m',
    });

    /**
     * @type {Readonly<{region: RegionKey, bands: number[], segment: SegmentKey,
     *                 velocityFactor: number, marginPct: number, units: UnitKey,
     *                 wireLenM: Meters}>}
     */
    /**
     * Wire length used to be written in feet under ?len=.  New links carry
     * metres under ?len_m=; the old key is still read so links shared before
     * the internals moved to metres resolve to the same wire.
     */
    const LEGACY_LEN_FT_KEY = 'len';

    const DEFAULTS = Object.freeze({
      region: 'us',
      bands: [80, 40, 20, 15, 10],
      segment: 'full',
      velocityFactor: DEFAULT_VELOCITY_FACTOR,
      marginPct: DEFAULT_MARGIN_PCT,
      units: 'ft',
      wireLenM: 0,
    });

    // ============================================================
    // Length math
    // ============================================================

    /**
     * Half wavelength of a wire, in metres.
     * lambda/2 = c / (2 f) scaled by the wire's velocity factor.  With
     * vf = 0.95 this is the familiar 468 / f(MHz) dipole formula in feet.
     *
     * @param {Hertz} freqHz
     * @param {number} velocityFactor
     * @returns {Meters}
     */
    const halfWaveM = (freqHz, velocityFactor) =>
      (C_SPEED / freqHz) * velocityFactor / 2;

    /**
     * Band edges for the selected segment, low frequency first.
     * @param {Band} band
     * @param {SegmentKey} segment
     * @returns {[Hertz, Hertz]}
     */
    const bandEdgesHz = (band, segment) => {
      const [loHz, hiHz] = band[SEGMENTS[segment].key];
      return [loHz, hiHz];
    };

    /**
     * The nth half-wave resonance of one band, as a length interval in feet
     * widened by the clearance margin.  An end-fed wire that is a multiple of
     * lambda/2 presents a very high feedpoint impedance (thousands of ohms)
     * that most tuners and 9:1 ununs cannot match.  The band's high frequency
     * gives the short end of the interval.
     *
     * The margin is a fraction of one half wavelength, not of the wire length:
     * what detunes the feedpoint is the offset from resonance measured in
     * wavelengths, which does not grow with n.  Scaling it by n instead would
     * make the nth zone n times wider and swallow every gap between them.
     *
     * @param {Band} band
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} margin  fraction of a half wavelength
     * @param {number} n       which half-wave multiple
     * @returns {Required<Interval>}
     */
    const resonanceInterval = (band, segment, velocityFactor, margin, n) => {
      const [loHz, hiHz] = bandEdgesHz(band, segment);
      return {
        lo: (n - margin) * halfWaveM(hiHz, velocityFactor),
        hi: (n + margin) * halfWaveM(loHz, velocityFactor),
        label: `${band.label} ${n} x λ/2`,
        kind: 'resonance',
      };
    };

    /**
     * Every resonance interval of every selected band up to maxLenM.  The
     * multiple runs as high as the map needs: a fixed cap would silently stop
     * covering the high bands, whose half wave can be hundreds of times
     * shorter than the map is long.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} marginPct
     * @param {Meters} maxLenM
     * @returns {Required<Interval>[]}
     */
    const avoidIntervals = (bands, segment, velocityFactor, marginPct, maxLenM) => {
      const margin = marginPct / 100;
      const intervals = [];
      for (const band of bands) {
        const shortest = halfWaveM(bandEdgesHz(band, segment)[1], velocityFactor);
        if (!(shortest > 0)) continue;  // degenerate velocity factor
        const highestMultiple = Math.ceil(maxLenM / shortest) + 1;
        for (let n = 1; n <= highestMultiple; n++) {
          const interval = resonanceInterval(band, segment, velocityFactor, margin, n);
          if (interval.lo > maxLenM) break;
          intervals.push(interval);
        }
      }
      return intervals;
    };

    /**
     * A wire shorter than a quarter wave on the lowest selected band is a poor
     * radiator and a hard load for a tuner, so treat it as unusable.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @returns {Meters}
     */
    const tooShortM = (bands, segment, velocityFactor) => {
      if (bands.length === 0) return 0;
      const lowestHz = Math.min(...bands.map(b => bandEdgesHz(b, segment)[0]));
      return halfWaveM(lowestHz, velocityFactor) / 2;
    };

    /**
     * Merge overlapping or touching intervals; input need not be sorted.
     * @param {Interval[]} intervals
     * @returns {{lo: Meters, hi: Meters}[]}
     */
    const mergeIntervals = (intervals) => {
      const sorted = [...intervals].sort((a, b) => a.lo - b.lo);
      const merged = [];
      for (const interval of sorted) {
        const last = merged[merged.length - 1];
        if (last && interval.lo <= last.hi) {
          last.hi = Math.max(last.hi, interval.hi);
        } else {
          merged.push({ lo: interval.lo, hi: interval.hi });
        }
      }
      return merged;
    };

    /**
     * Complement of the merged avoid intervals within [0, maxLenM].
     * @param {{lo: Meters, hi: Meters}[]} merged
     * @param {Meters} maxLenM
     * @returns {{lo: Meters, hi: Meters}[]}
     */
    const usableIntervals = (merged, maxLenM) => {
      const usable = [];
      let cursor = 0;
      for (const gap of merged) {
        if (gap.lo > cursor) usable.push({ lo: cursor, hi: Math.min(gap.lo, maxLenM) });
        cursor = Math.max(cursor, gap.hi);
        if (cursor >= maxLenM) break;
      }
      if (cursor < maxLenM) usable.push({ lo: cursor, hi: maxLenM });
      return usable.filter(u => u.hi > u.lo);
    };

    /**
     * A length to recommend inside a usable span: the roundest number that
     * still lies strictly inside it.  Rounding to a fixed precision would push
     * the pick onto, or past, the edge of a span narrower than that precision,
     * recommending a length the page then reports as one to avoid.
     *
     * @param {{lo: Meters, hi: Meters}} span
     * @param {UnitKey} units  what the number will be read in
     * @returns {Meters}
     */
    const pickInSpan = (span, units) => {
      const center = (span.lo + span.hi) / 2;
      const centerDisplay = toDisplay(center, units);
      for (const step of PICK_STEPS) {
        const rounded = fromDisplay(
          Number((Math.round(centerDisplay / step) * step).toFixed(2)), units);
        if (rounded > span.lo && rounded < span.hi) return rounded;
      }
      return center;
    };

    /**
     * Everything the length map and tables need, derived from the current
     * selection.  All lengths are in metres.
     *
     * @param {RegionKey} region
     * @param {number[]} bandsM      selected bands, by wavelength in meters
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} marginPct
     * @param {Meters} maxLenM
     * @param {UnitKey} units
     * @returns {{bands: Band[], avoid: Interval[], merged: {lo: Meters, hi: Meters}[],
     *            usable: {lo: Meters, hi: Meters}[], suggestions: Span[], shortLimit: Meters}}
     */
    const solve = (region, bandsM, segment, velocityFactor, marginPct, maxLenM, units) => {
      const bands = bandsIn(region).filter(b => bandsM.includes(b.m));
      const resonances = avoidIntervals(bands, segment, velocityFactor, marginPct, maxLenM);
      const shortLimit = tooShortM(bands, segment, velocityFactor);
      const shortZone = shortLimit > 0
        ? [{ lo: 0, hi: shortLimit, label: 'shorter than λ/4', kind: 'short' }]
        : [];
      const avoid = [...shortZone, ...resonances];
      const merged = mergeIntervals(avoid);
      const usable = usableIntervals(merged, maxLenM);
      const suggestions = [...usable]
        .map(u => ({ ...u, pick: pickInSpan(u, units), clearance: (u.hi - u.lo) / 2 }))
        .sort((a, b) => b.clearance - a.clearance)
        .slice(0, MAX_SUGGESTIONS);
      return { bands, avoid, merged, usable, suggestions, shortLimit };
    };

    /**
     * Recommended length from the usable span nearest to lenM, or null if
     * none is left.  Taken from the middle of the span rather than its closest
     * edge, so the suggestion has the most clearance that span can offer.
     *
     * @param {Meters} lenM
     * @param {{lo: Meters, hi: Meters}[]} usable
     * @param {UnitKey} units
     * @returns {?Meters}
     */
    const nearestClearLength = (lenM, usable, units) => {
      /** @type {?Meters} */
      let best = null;
      for (const span of usable) {
        const center = pickInSpan(span, units);
        if (!best || Math.abs(center - lenM) < Math.abs(best - lenM)) best = center;
      }
      return best;
    };

    /**
     * The largest clearance margin, below the one asked for, that still leaves
     * somewhere to put the wire.  Used to turn "no clear span" into a concrete
     * offer.  Binary search: feasibility is monotonic in the margin, since
     * widening every zone can only remove spans.
     *
     * @param {RegionKey} region
     * @param {number[]} bandsM
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} askedPct
     * @param {Meters} maxLenM
     * @param {UnitKey} units
     * @returns {?{marginPct:number, lengthM:Meters}} null if even a margin of
     *          zero leaves nothing, i.e. the bands cover every length outright.
     */
    const bestFeasibleMargin = (region, bandsM, segment, velocityFactor,
                                askedPct, maxLenM, units) => {
      /** @param {number} pct */
      const spansAt = (pct) =>
        solve(region, bandsM, segment, velocityFactor, pct, maxLenM, units).suggestions;
      if (spansAt(0).length === 0) return null;

      let feasible = 0;
      let tooWide = askedPct;
      for (let i = 0; i < MARGIN_SEARCH_STEPS; i++) {
        const mid = (feasible + tooWide) / 2;
        if (spansAt(mid).length > 0) feasible = mid; else tooWide = mid;
      }
      // Round down to the slider's step so the offer is one the user can set.
      const marginPct = Math.floor(feasible / MARGIN_STEP_PCT) * MARGIN_STEP_PCT;
      const best = spansAt(marginPct)[0];
      return best ? { marginPct, lengthM: best.pick } : null;
    };

    /**
     * Judge one wire length against the selected bands directly, rather than
     * against the precomputed map intervals, so that lengths past the end of
     * the map are still answered correctly.
     *
     * Only the multiples that can bracket lenM are examined: for band n,
     * lenM lies between the nth and (n+1)th resonance for n around
     * lenM / (half wave).
     *
     * @param {Meters} lenM
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} marginPct
     * @param {Meters} shortLimit
     * @returns {?({ok: true, hit: null, nearest: Required<Interval>, clearance: Meters}
     *            | {ok: false, hit: Required<Interval>, nearest: Required<Interval>,
     *               clearance: Meters})}
     *          clearance is the distance in feet to the nearest zone edge.
     */
    const judgeLength = (lenM, bands, segment, velocityFactor, marginPct, shortLimit) => {
      if (!(lenM > 0)) return null;
      const margin = marginPct / 100;
      /** @type {Required<Interval>[]} */
      const zones = [];

      if (shortLimit > 0) {
        zones.push({ lo: 0, hi: shortLimit, label: 'shorter than λ/4', kind: 'short' });
      }
      for (const band of bands) {
        const [loHz, hiHz] = bandEdgesHz(band, segment);
        const shortest = halfWaveM(hiHz, velocityFactor);
        const longest = halfWaveM(loHz, velocityFactor);
        if (!(shortest > 0)) continue;  // degenerate velocity factor
        const nLo = Math.max(1, Math.floor(lenM / longest - margin));
        const nHi = Math.ceil(lenM / shortest + margin);
        for (let n = nLo; n <= nHi; n++) {
          zones.push(resonanceInterval(band, segment, velocityFactor, margin, n));
        }
      }

      // Nothing selected to judge against, so there is no verdict to give.
      if (zones.length === 0) return null;

      const hit = zones.find(z => lenM >= z.lo && lenM <= z.hi) ?? null;

      // Inside a zone, the only distance worth reporting is the way out of
      // that zone; taking a minimum over the others would quote a figure
      // belonging to a zone the message does not name.
      if (hit) {
        return { ok: false, hit, nearest: hit,
                 clearance: Math.min(lenM - hit.lo, hit.hi - lenM) };
      }

      /** @type {?Required<Interval>} */
      let nearest = null;
      let clearance = Infinity;
      for (const zone of zones) {
        const distance = Math.min(Math.abs(lenM - zone.lo), Math.abs(lenM - zone.hi));
        if (distance < clearance) {
          clearance = distance;
          nearest = zone;
        }
      }
      // zones is non-empty here, so the loop above always set nearest.
      return { ok: true, hit: null,
               nearest: /** @type {Required<Interval>} */ (nearest),
               clearance: Number.isFinite(clearance) ? clearance : 0 };
    };

    // ============================================================
    // Formatting
    // ============================================================

    /** @param {Meters} lenM @param {UnitKey} units @returns {number} */
    const toDisplay = (lenM, units) => lenM * UNITS[units].perMeter;

    /** @param {number} len  in display units @param {UnitKey} units @returns {Meters} */
    const fromDisplay = (len, units) => len / UNITS[units].perMeter;

    /** @param {Meters} lenM @param {UnitKey} units @returns {string} */
    const fmtLen = (lenM, units) => UNITS[units].format(lenM);

    /**
     * Band edges in kHz below 1 MHz, MHz above, so LF bands stay readable.
     * @param {Hertz} loHz
     * @param {Hertz} hiHz
     * @returns {string}
     */
    const fmtBandEdges = (loHz, hiHz) => hiHz < 1e6
      ? `${(loHz / 1e3).toFixed(1)}-${(hiHz / 1e3).toFixed(1)} kHz`
      : `${(loHz / 1e6).toFixed(3)}-${(hiHz / 1e6).toFixed(3)}`;

    /** Unit note for anything printed by fmtBandEdges, which labels only kHz. */
    const BAND_EDGE_UNIT_HINT = 'Frequencies in MHz unless marked';

    /**
     * Tick step in display units that yields roughly TARGET_TICKS ticks.
     * @param {number} spanDisplay
     * @returns {number}
     */
    const tickStep = (spanDisplay) => {
      const ideal = spanDisplay / TARGET_TICKS;
      return TICK_STEPS.find(step => step >= ideal) ?? TICK_STEPS[TICK_STEPS.length - 1];
    };

    // ============================================================
    // URL state
    // ============================================================

    /** @param {number} value @param {{min: number, max: number}} range */
    const clamp = (value, { min, max }) => Math.min(max, Math.max(min, value));

    /** @param {?string} raw @param {number} fallback @returns {number} */
    const parseNum = (raw, fallback) => {
      const value = parseFloat(raw ?? '');
      return Number.isFinite(value) ? value : fallback;
    };

    /**
     * Own properties only.  A bare `key in obj` also matches everything on
     * Object.prototype, so ?region=toString would pass the check and then
     * fail to resolve to a band plan.
     *
     * @template {Object} T
     * @param {T} obj
     * @param {?string} key
     * @returns {key is (string & keyof T)}
     */
    const isKeyOf = (obj, key) =>
      key !== null && Object.prototype.hasOwnProperty.call(obj, key);

    /**
     * Object.entries, keeping the key type.  The built-in widens keys to
     * string, which loses the union the state and lookups are typed on.
     *
     * @template {Object} T
     * @param {T} obj
     * @returns {[string & keyof T, T[string & keyof T]][]}
     */
    const entriesOf = (obj) => /** @type {any} */ (Object.entries(obj));

    /**
     * Wire length from either spelling, preferring the current one.
     * @param {URLSearchParams} params
     * @returns {Meters}
     */
    const readWireLenM = (params) => {
      const meters = params.get(URL_KEYS.wireLenM);
      if (meters !== null) return parseNum(meters, DEFAULTS.wireLenM);
      const feet = params.get(LEGACY_LEN_FT_KEY);
      return feet === null ? DEFAULTS.wireLenM : parseNum(feet, 0) / FT_PER_M;
    };

    const getUrlParams = () => {
      const params = new URLSearchParams(window.location.search);
      const rawRegion = params.get(URL_KEYS.region);
      const region = isKeyOf(REGIONS, rawRegion) ? rawRegion : DEFAULTS.region;
      const rawBands = params.get(URL_KEYS.bands);
      const bands = rawBands === null
        ? DEFAULTS.bands
        : rawBands.split(',').map(Number).filter(m => bandsIn(region).some(b => b.m === m));
      const segment = params.get(URL_KEYS.segment);
      const units = params.get(URL_KEYS.units);
      return {
        region,
        bands,
        segment: isKeyOf(SEGMENTS, segment) ? segment : DEFAULTS.segment,
        velocityFactor: clamp(
          parseNum(params.get(URL_KEYS.velocityFactor), DEFAULTS.velocityFactor),
          VELOCITY_FACTOR_RANGE),
        marginPct: clamp(parseNum(params.get(URL_KEYS.marginPct), DEFAULTS.marginPct),
                         MARGIN_PCT_RANGE),
        units: isKeyOf(UNITS, units) ? units : DEFAULTS.units,
        wireLenM: Math.max(0, readWireLenM(params)),
      };
    };

    /**
     * A length the page chose on load counts as a default, so opening the page
     * fresh leaves a clean URL.
     */
    /**
     * @param {ReturnType<typeof getUrlParams>} state
     * @param {?Meters} autoLenM
     * @returns {boolean}
     */
    const isAtDefaults = (state, autoLenM) =>
      state.region === DEFAULTS.region &&
      state.segment === DEFAULTS.segment &&
      state.velocityFactor === DEFAULTS.velocityFactor &&
      state.marginPct === DEFAULTS.marginPct &&
      state.units === DEFAULTS.units &&
      (state.wireLenM === DEFAULTS.wireLenM || state.wireLenM === autoLenM) &&
      state.bands.length === DEFAULTS.bands.length &&
      DEFAULTS.bands.every(m => state.bands.includes(m));

    // ============================================================
    // Components
    // ============================================================

    /** Horizontal map of wire length: red where resonant, green where usable. */
    /**
     * @param {{solution: ReturnType<typeof solve>, maxLenM: Meters, units: UnitKey,
     *          wireLenM: Meters, onPick: (lenM: Meters) => void}} props
     */
    function LengthMap({ solution, maxLenM, units, wireLenM, onPick }) {
      const [hoverM, setHoverM] = useState(/** @type {?Meters} */ (null));

      const plotWidth = MAP.width - MAP.left - MAP.right;
      /** @param {Meters} lenM @returns {number} SVG x */
      const xOf = (lenM) => MAP.left + (lenM / maxLenM) * plotWidth;

      /** @param {number} x  SVG x @returns {Meters} */
      const lenAt = (x) => ((x - MAP.left) / plotWidth) * maxLenM;

      const step = tickStep(toDisplay(maxLenM, units));
      const ticks = [];
      for (let value = 0; value <= toDisplay(maxLenM, units); value += step) {
        ticks.push(value);
      }

      /**
       * Length under the pointer, clamped to the map.
       * @param {React.MouseEvent<SVGSVGElement>} event
       * @returns {Meters}
       */
      const lenAtEvent = (event) => {
        const rect = event.currentTarget.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * MAP.width;
        return Math.max(0, Math.min(maxLenM, lenAt(x)));
      };

      /** @param {React.MouseEvent<SVGSVGElement>} event */
      const handleMove = (event) => setHoverM(lenAtEvent(event));

      const hoverHit = hoverM === null
        ? null
        : solution.avoid.find(a => hoverM >= a.lo && hoverM <= a.hi);

      const barBottom = MAP.top + MAP.barHeight;

      return (
        <div className="map-container">
          <svg className="map-svg" viewBox={`0 0 ${MAP.width} ${MAP.height}`}
               onMouseMove={handleMove} onMouseLeave={() => setHoverM(null)}
               onClick={(event) => onPick(lenAtEvent(event))}>
            <defs>
              {/* Diagonal hatch marks the too-short zone without relying on hue. */}
              <pattern id="hatch-short" width="8" height="8" patternUnits="userSpaceOnUse"
                       patternTransform="rotate(45)">
                <rect width="8" height="8" fill="#2a2a28" />
                <rect width="3" height="8" fill={COLORS.short} />
              </pattern>
            </defs>
            {/* Usable background */}
            {solution.usable.map((u, i) => (
              <rect key={`u${i}`} x={xOf(u.lo)} y={MAP.top}
                    width={Math.max(MIN_BAND_WIDTH, xOf(u.hi) - xOf(u.lo))}
                    height={MAP.barHeight}
                    fill={COLORS.usable} stroke={COLORS.usableEdge} strokeWidth="0.5" />
            ))}
            {/* Lengths to avoid */}
            {solution.avoid.map((a, i) => (
              <rect key={`a${i}`} x={xOf(Math.max(0, a.lo))} y={MAP.top}
                    width={Math.max(MIN_BAND_WIDTH,
                                    xOf(Math.min(a.hi, maxLenM)) - xOf(Math.max(0, a.lo)))}
                    height={MAP.barHeight}
                    fill={a.kind === 'short' ? 'url(#hatch-short)' : COLORS.avoid}
                    opacity={a.kind === 'short' ? 1 : 0.9} />
            ))}
            {/* Axis and ticks */}
            <line x1={MAP.left} y1={barBottom} x2={MAP.width - MAP.right} y2={barBottom}
                  stroke={COLORS.axis} strokeWidth="1" />
            {ticks.map((value) => {
              const x = xOf(fromDisplay(value, units));
              return (
                <g key={value}>
                  <line x1={x} y1={barBottom} x2={x} y2={barBottom + 5}
                        stroke={COLORS.axis} strokeWidth="1" />
                  <text x={x} y={barBottom + 24} fill={COLORS.label} fontSize={MAP.tickFontSize}
                        textAnchor="middle" fontFamily="monospace">{value}</text>
                </g>
              );
            })}
            <text x={MAP.width / 2} y={MAP.height - 4} fill={COLORS.label} fontSize={MAP.axisFontSize}
                  textAnchor="middle" fontFamily="monospace">
              wire length ({UNITS[units].axisLabel})
            </text>
            {/* Selected length marker */}
            {wireLenM > 0 && wireLenM <= maxLenM && (
              <line x1={xOf(wireLenM)} y1={MAP.top - 6} x2={xOf(wireLenM)} y2={barBottom + 3}
                    stroke={COLORS.marker} strokeWidth="2" />
            )}
            {hoverM !== null && (
              <line x1={xOf(hoverM)} y1={MAP.top} x2={xOf(hoverM)} y2={barBottom}
                    stroke="#fff" strokeWidth="1" opacity="0.5" />
            )}
          </svg>
          <div className="map-readout">
            {hoverM === null
              ? 'Click the map to set the wire length.'
              : `${fmtLen(hoverM, units)} - ${hoverHit ? `avoid: ${hoverHit.label}` : 'usable'}`}
          </div>
          <div className="map-legend">
            <span><span className="swatch" style={{ background: COLORS.avoid }}></span>
              near a half-wave resonance</span>
            <span><span className="swatch swatch-hatch"></span>
              shorter than λ/4</span>
            <span><span className="swatch" style={{ background: COLORS.usable,
              boxShadow: `inset 0 0 0 1px ${COLORS.usableEdge}` }}></span>usable</span>
            <span><span className="swatch" style={{ background: COLORS.marker }}></span>
              your wire</span>
          </div>
        </div>
      );
    }

    function RandomWire() {
      const [p, setP] = useState(getUrlParams);

      /** @param {Partial<ReturnType<typeof getUrlParams>>} updates */
      const set = (updates) => setP(prev => ({ ...prev, ...updates }));

      const { region, bands, segment, velocityFactor, marginPct, units, wireLenM } = p;

      // Map spans one full wavelength at the lowest selected band, which is the
      // longest wire worth considering for that band.
      const maxLenM = useMemo(() => {
        const selected = bandsIn(region).filter(b => bands.includes(b.m));
        if (selected.length === 0) return EMPTY_MAP_LEN_M;
        const lowestHz = Math.min(...selected.map(b => bandEdgesHz(b, segment)[0]));
        return 2 * halfWaveM(lowestHz, velocityFactor);
      }, [region, bands, segment, velocityFactor]);

      // units is a dependency because a recommended length is rounded to a
      // round number in whatever unit it will be read in.
      const solution = useMemo(
        () => solve(region, bands, segment, velocityFactor, marginPct, maxLenM, units),
        [region, bands, segment, velocityFactor, marginPct, maxLenM, units]);

      // Only searched when the asked-for margin leaves nothing.
      const fallback = useMemo(
        () => (solution.suggestions.length > 0 || bands.length === 0
          ? null
          : bestFeasibleMargin(region, bands, segment, velocityFactor, marginPct,
                               maxLenM, units)),
        [solution, region, bands, segment, velocityFactor, marginPct, maxLenM, units]);

      const clearLength = useMemo(
        () => nearestClearLength(wireLenM, solution.usable, units),
        [wireLenM, solution, units]);

      const verdict = useMemo(
        () => judgeLength(wireLenM, solution.bands, segment, velocityFactor,
                          marginPct, solution.shortLimit),
        [wireLenM, solution, segment, velocityFactor, marginPct]);

      // Jump to the widest clear span whenever the inputs change, so the
      // answer always suits the current selection.  Typing a length or
      // picking one off the map leaves the solution alone, so those stick
      // until an input changes.  A length in the URL wins on first load.
      const autoLenM = useRef(/** @type {?Meters} */ (null));
      const firstRun = useRef(true);
      useEffect(() => {
        const wasFirstRun = firstRun.current;
        firstRun.current = false;
        if (wasFirstRun && wireLenM > 0) return;
        const best = solution.suggestions[0];
        if (!best) return;
        autoLenM.current = best.pick;
        set({ wireLenM: autoLenM.current });
      }, [solution]);

      useEffect(() => {
        if (isAtDefaults(p, autoLenM.current)) {
          window.history.replaceState(null, '', window.location.pathname);
          return;
        }
        const params = new URLSearchParams();
        params.set(URL_KEYS.region, region);
        params.set(URL_KEYS.bands, bands.join(','));
        params.set(URL_KEYS.segment, segment);
        params.set(URL_KEYS.velocityFactor, String(velocityFactor));
        params.set(URL_KEYS.marginPct, String(marginPct));
        params.set(URL_KEYS.units, units);
        if (wireLenM > 0) params.set(URL_KEYS.wireLenM, wireLenM.toFixed(3));
        window.history.replaceState(null, '', `${window.location.pathname}?${params}`);
      }, [p]);

      /** @param {number} m  band wavelength in meters */
      const toggleBand = (m) => set({
        bands: bands.includes(m) ? bands.filter(x => x !== m) : [...bands, m].sort((a, b) => b - a),
      });

      /**
       * Switching region drops any selected band that region does not have.
       * @param {RegionKey} key
       */
      const setRegion = (key) => set({
        region: key,
        bands: bands.filter(m => bandsIn(key).some(b => b.m === m)),
      });

      /** @param {Meters} lenM */
      const setWireLen = (lenM) => set({
        wireLenM: fromDisplay(Number(toDisplay(lenM, units).toFixed(2)), units) });

      const noBands = bands.length === 0;

      return (
        <div className="app">
          <h1 className="title">Random Wire Antenna Length Calculator</h1>
          <div className="footer">
            End-fed wire lengths that dodge half-wave resonances on the bands you pick
          </div>

          <div className="main-content">
            <div className="column">
              <div className="panel">
                <div className="panel-header">Band plan</div>
                <div className="presets">
                  {entriesOf(REGIONS).map(([key, def]) => (
                    <button key={key}
                            className={`btn preset-btn ${region === key ? 'active' : ''}`}
                            aria-pressed={region === key}
                            onClick={() => setRegion(key)}>
                      {def.label}
                    </button>
                  ))}
                </div>
                <div className="control-hint">{REGIONS[region].note}</div>
              </div>

              <div className="panel">
                <div className="panel-header">Bands of interest</div>
                <div className="presets">
                  {PRESETS.map(preset => (
                    <button key={preset.label} className="btn preset-btn"
                            onClick={() => set({ bands: [...preset.bands] })}>
                      {preset.label}
                    </button>
                  ))}
                </div>
                <div className="segment-toggle">
                  {entriesOf(SEGMENTS).map(([key, def]) => (
                    <button key={key}
                            className={`btn segment-btn ${segment === key ? 'active' : ''}`}
                            aria-pressed={segment === key}
                            onClick={() => set({ segment: key })}>
                      {def.label}
                    </button>
                  ))}
                </div>
                <div className="band-grid">
                  {bandsIn(region).map(band => {
                    const [lo, hi] = bandEdgesHz(band, segment);
                    return (
                      <button key={band.m}
                              className={`btn band-btn ${bands.includes(band.m) ? 'active' : ''}`}
                              aria-pressed={bands.includes(band.m)}
                              onClick={() => toggleBand(band.m)}>
                        {band.label}
                        <span className="band-freq">{fmtBandEdges(lo, hi)}</span>
                      </button>
                    );
                  })}
                </div>
                <div className="control-hint right">{BAND_EDGE_UNIT_HINT}</div>
              </div>

              <div className="panel">
                <div className="panel-header">Assumptions</div>
                <label className="control-label">
                  Clearance from resonance: <span className="control-value">{marginPct}%</span>
                  <input className="control-slider" type="range"
                         min={MARGIN_PCT_RANGE.min} max={MARGIN_PCT_RANGE.max}
                         step={MARGIN_STEP_PCT}
                         value={marginPct}
                         onChange={(e) => set({
                           marginPct: clamp(Number(e.target.value), MARGIN_PCT_RANGE) })} />
                  <div className="control-hint">
                    Widens each avoid zone by this fraction of a half wavelength,
                    on both sides.
                  </div>
                </label>
                <label className="control-label">
                  Wire velocity factor:{' '}
                  <input className="num-input" type="number" step="0.01"
                         min={VELOCITY_FACTOR_RANGE.min} max={VELOCITY_FACTOR_RANGE.max}
                         value={velocityFactor}
                         onChange={(e) => set({
                           velocityFactor: clamp(Number(e.target.value),
                                                 VELOCITY_FACTOR_RANGE) })} />
                  <div className="control-hint">
                    0.95 gives the classic λ/2 = 468 / f(MHz) feet.
                  </div>
                </label>
                <label className="control-label">
                  Units:{' '}
                  {entriesOf(UNITS).map(([key, def]) => (
                    <button key={key}
                            className={`btn preset-btn ${units === key ? 'active' : ''}`}
                            aria-pressed={units === key}
                            onClick={() => set({ units: key })}>
                      {def.label}
                    </button>
                  ))}
                </label>
              </div>

            </div>

            <div className="column column-wide">
              <div className={`verdict ${verdict ? (verdict.ok ? 'good' : 'bad') : ''}`}>
                <div className="verdict-headline">
                  Wire length{' '}
                  <input className="num-input len-input" type="number" min="0" step="0.5"
                         value={toDisplay(wireLenM, units).toFixed(2)}
                         onChange={(e) => setWireLen(fromDisplay(Number(e.target.value), units))} />
                  {' '}{UNITS[units].abbrev}
                  {verdict && (verdict.ok ? ': usable' : ': avoid')}
                </div>
                <div className="verdict-detail">
                  {!verdict
                    ? 'Type a length, click the map, or pick one from the table below.'
                    : verdict.ok
                      ? `Nearest zone is ${verdict.nearest.label}, `
                        + `${fmtLen(verdict.clearance, units)} away `
                        + `(${fmtLen(verdict.nearest.lo, units)} to ${fmtLen(verdict.nearest.hi, units)}).`
                      : `Falls in ${verdict.hit.label} `
                        + `(${fmtLen(verdict.hit.lo, units)} to ${fmtLen(verdict.hit.hi, units)}); `
                        + `${fmtLen(verdict.clearance, units)} from the near edge.`}
                  {wireLenM > maxLenM
                    && ' Longer than one wavelength on the lowest band selected.'}
                  {verdict && !verdict.ok && clearLength !== null && (
                    <>
                      {' '}
                      <button className="btn link-btn" onClick={() => setWireLen(clearLength)}>
                        Nearest clear length: {fmtLen(clearLength, units)}
                      </button>
                    </>
                  )}
                </div>
              </div>

              {noBands ? (
                <div className="panel"><div className="empty-note">
                  Select at least one band.
                </div></div>
              ) : (
                <LengthMap solution={solution} maxLenM={maxLenM} units={units}
                           wireLenM={wireLenM} onPick={setWireLen} />
              )}

              {!noBands && (
                <div className="panel">
                  <div className="panel-header">Best lengths (widest clear spans)</div>
                  {solution.suggestions.length === 0 ? (
                    <div className="empty-note">
                      No length clears every selected band at {marginPct}%.
                      {fallback
                        ? <>
                            {' '}The most any length can manage is {fallback.marginPct}%.{' '}
                            <button className="btn link-btn"
                                    onClick={() => set({ marginPct: fallback.marginPct,
                                                         wireLenM: fallback.lengthM })}>
                              Use {fallback.marginPct}% at {fmtLen(fallback.lengthM, units)}
                            </button>
                          </>
                        : ' These bands cover every length between them; drop one.'}
                    </div>
                  ) : (
                    <table>
                      <thead>
                        <tr>
                          <th>Length</th><th>Usable from</th><th>to</th><th>Margin</th>
                        </tr>
                      </thead>
                      <tbody>
                        {solution.suggestions.map((s, i) => (
                          <tr key={i} className="pick" onClick={() => setWireLen(s.pick)}>
                            <td className="best-length">{fmtLen(s.pick, units)}</td>
                            <td>{fmtLen(s.lo, units)}</td>
                            <td>{fmtLen(s.hi, units)}</td>
                            <td>+/- {fmtLen(s.clearance, units)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              )}

              {!noBands && (
                <div className="panel">
                  <div className="panel-header">Half-wave lengths per band</div>
                  <table>
                    <thead>
                      <tr>
                        <th>Band</th><th>Edges</th><th>λ/2 span</th>
                      </tr>
                    </thead>
                    <tbody>
                      {solution.bands.map(band => {
                        const [lo, hi] = bandEdgesHz(band, segment);
                        return (
                          <tr key={band.m}>
                            <td>{band.label}</td>
                            <td>{fmtBandEdges(lo, hi)}</td>
                            <td>
                              {fmtLen(halfWaveM(hi, velocityFactor), units)} -{' '}
                              {fmtLen(halfWaveM(lo, velocityFactor), units)}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  <div className="control-hint right">{BAND_EDGE_UNIT_HINT}</div>
                </div>
              )}
            </div>
          </div>

          <div className="info">
            <p>
              An end-fed wire whose length is a multiple of a half wavelength presents a
              very high feedpoint impedance (thousands of ohms), which most tuners and 9:1
              ununs handle badly. <strong>Pick a length that misses every half-wave multiple
              on every band you plan to use</strong>, and keep it at least a quarter wave
              long on the lowest band.
            </p>
            <p>
              Lengths here are physical wire lengths using λ/2 = c / (2 f) times the
              velocity factor; at 0.95 that is the familiar 468 / f(MHz) feet. Real wire
              near ground, with insulators and a counterpoise, will differ, so favor
              lengths with generous margin. A counterpoise or radial system is still
              required; the feedpoint impedance also depends on it.
            </p>
            <p>
              US band edges are from{' '}
              <a href="https://www.law.cornell.edu/cfr/text/47/97.301">47 CFR 97.301</a>
              {' '}as summarised by the{' '}
              <a href="https://www.arrl.org/frequency-allocations">ARRL frequency chart</a>,
              including the{' '}
              <a href="https://www.arrl.org/news/new-60-meter-frequencies-available-as-of-february-13">60m
              rules effective 13 February 2026</a>. Other regions follow the IARU band
              plans; national rules vary within a region, so check your own licence
              conditions before trusting the edges.
            </p>
            <p>
              Method from Mike Markowski AB3AP,{' '}
              <a href="http://udel.edu/~mm/ham/randomWire/">udel.edu/~mm/ham/randomWire/</a>.
            </p>
          </div>

          <div className="footer">
            {'\u00A9'} 2026 Christopher Hoover.{' '}
            <a href="https://github.com/charlieh0tel/ham_radio/blob/master/LICENSE">MIT License</a>.{' '}
            <a href="https://github.com/charlieh0tel/ham_radio">GitHub</a>.{' '}
            <a href="https://github.com/charlieh0tel/ham_radio/issues">Bugs &amp; Feedback</a>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    if (!rootElement) throw new Error('missing #root');
    ReactDOM.createRoot(rootElement).render(<RandomWire />);
  </script>
</body>
</html>
