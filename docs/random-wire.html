                  <fieldset className="control-group" role="radiogroup">
                    <legend>Ground</legend>
                    {entriesOf(SOILS).map(([key, def]) => (
                      <button key={key}
                              className={`btn preset-btn ${soil === key ? 'active' : ''}`}
                              role="radio" aria-checked={soil === key}
                              onClick={() => set({ soil: key })}>
                        {def.label}
                      </button>
                    ))}
                    <div className="control-hint">
                      Sandy or rocky, medium soil, damp or marshy. Not a quality
                      scale: damp ground does not give a better match, it gives a
                      sharper resonance, so deeper dips and higher peaks.
                    </div>
                  </fieldset>
                )}
                {mode === 'impedance' && (
                  <fieldset className="control-group" role="radiogroup">
                    <legend>Tuner</legend>
                    {entriesOf(TUNERS).map(([key, def]) => (
                      <button key={key}
                              className={`btn preset-btn ${tuner === key ? 'active' : ''}`}
                              role="radio" aria-checked={tuner === key}
                              onClick={() => set({ tuner: key })}>
                        {def.limit}:1
                      </button>
                    ))}
                    <div className="control-hint">
                      The highest SWR yours will match: about 3:1 built into a
                      rig, 5:1 compact auto, 9:1 wide-range, 12:1 roller. A
                      length is good only if every band beats it.
                    </div>
                  </fieldset>
                )}
                {mode === 'impedance' && (
                  <fieldset className="control-group" role="radiogroup">
                    <legend>Unun ratio</legend>
                    {UNUN_RATIOS.map(ratio => (
                      <button key={ratio}
                              className={`btn preset-btn ${ununRatio === ratio ? 'active' : ''}`}
                              role="radio" aria-checked={ununRatio === ratio}
                              onClick={() => set({ ununRatio: ratio })}>
                        {ratio}:1
                      </button>
                    ))}
                    <div className="control-hint">
                      1:1 is a direct feed; 9:1 suits a random wire, 49:1 and 64:1 an
                      end-fed half wave.
                      {ununRatio >= 49 && (
                        <> At these ratios you are aiming at a resonance rather
                        than avoiding one, and the model draws resonances about
                        twice too sharp &mdash; expect it to rate a true half
                        wave worse than it is.</>
                      )}
                    </div>
                  </fieldset>
                )}
                {mode === 'classical' && (
                <label className="control-label">
                  Clearance from resonance: <span className="control-value">{marginPct}%</span>
                  <input className="control-slider" type="range"
                         min={MARGIN_PCT_RANGE.min} max={MARGIN_PCT_RANGE.max}
                         step={MARGIN_STEP_PCT}
                         value={marginPct}
                         onChange={(e) => set({
                           marginPct: clamp(Number(e.target.value), MARGIN_PCT_RANGE) })} />
                  <div className="control-hint">
                    Widens each avoid zone by this fraction of a half wavelength,
                    on both sides.
                    {marginWorstSwr !== null && (
                      <> Leaves {usablePct}% of the axis usable; the worst band
                      of the worst length it offers models{' '}
                      {marginWorstSwr.toFixed(1)}:1 through a {ununRatio}:1.
                      That figure comes from the impedance model, not from this
                      rule &mdash; the rule has no impedance in it.</>
                    )}
                  </div>
                </label>
                )}
                {mode === 'classical' && (
                <label className="control-label">
                  Wire velocity factor:{' '}
                  <input className="num-input" type="number" step="0.01"
                         min={VELOCITY_FACTOR_RANGE.min} max={VELOCITY_FACTOR_RANGE.max}
                         value={velocityFactor}
                         onChange={(e) => set({
                           velocityFactor: clamp(Number(e.target.value),
                                                 VELOCITY_FACTOR_RANGE) })} />
                  <div className="control-hint">
                    0.95 gives the classic λ/2 = 468 / f(MHz) feet. The impedance
                    mode does not ask: fitted against NEC the wire runs at 1.0, and
                    the shortening this stands for is the return path and Z0, which
                    that model carries directly.
                  </div>
                </label>
                )}
              </div>


            </div>

            <div className="column column-wide">
              <div className={`verdict ${mode === 'impedance'
                ? (scoreHere ? (isGoodScore(scoreHere, tuner) ? 'good' : 'bad') : '')
                : verdict ? (verdict.ok ? 'good' : 'bad') : ''}`}>
                <div className="verdict-headline">
                  Wire length{' '}
                  <input className="num-input len-input" type="number" min="0" step="0.5"
                         value={lenShown}
                         onChange={(e) => {
                           setLenDraft(e.target.value);
                           const typed = Number(e.target.value);
                           if (e.target.value !== '' && Number.isFinite(typed)) {
                             setWireLen(fromDisplay(typed, units));
                           }
                         }}
                         onBlur={() => setLenDraft(null)} />
                  {' '}{UNITS[units].abbrev}
                  {mode === 'impedance'
                    ? (scoreHere ? `: SWR ${scoreHere.swr.toFixed(1)}:1` : '')
                    : verdict && (verdict.ok ? ': usable' : ': avoid')}
                </div>
                <div className="verdict-detail">
                  {mode === 'impedance' ? (
                    !scoreHere
                      ? 'Type a length, click the map, or pick one from the table below.'
                      : `Typical SWR at the radio through the ${ununRatio}:1, `
                        + `geometric mean across the selected bands.  Worst sample is `
                        + `${scoreHere.worst.swr.toFixed(1)}:1 on ${scoreHere.worst.band.label} `
                        + `at ${(scoreHere.worst.freqHz / 1e6).toFixed(3)} MHz.`
                  ) : !verdict
                    ? 'Type a length, click the map, or pick one from the table below.'
                    : verdict.ok
                      ? `Nearest zone is ${verdict.nearest.label}, `
                        + `${fmtLen(verdict.clearance, units)} away `
                        + `(${fmtLen(verdict.nearest.lo, units)} to ${fmtLen(verdict.nearest.hi, units)}).`
                      : `Falls in ${verdict.hit.label} `
                        + `(${fmtLen(verdict.hit.lo, units)} to ${fmtLen(verdict.hit.hi, units)}); `
                        + `${fmtLen(verdict.clearance, units)} from the near edge.`}
                  {wireLenM > maxLenM
                    && ' Longer than one wavelength on the lowest band selected.'}
                  {mode === 'classical' && verdict && !verdict.ok && clearLength !== null && (
                    <>
                      {' '}
                      <button className="btn link-btn" onClick={() => setWireLen(clearLength)}>
                        Nearest clear length: {fmtLen(clearLength, units)}
                      </button>
                    </>
                  )}
                </div>
              </div>

              {noBands ? (
                <div className="panel"><div className="empty-note">
                  Select at least one band.
                </div></div>
              ) : (
                <LengthMap solution={solution} score={score} maxLenM={maxLenM}
                           units={units} wireLenM={wireLenM} onPick={setWireLen} />
              )}

              {!noBands && (
                <div className="panel">
                  <div className="panel-header">
                    {mode === 'impedance'
                      ? 'Best lengths (lowest modelled SWR)'
                      : 'Best lengths (widest clear spans)'}
                  </div>
                  {mode === 'impedance' ? (
                    score === null || score.suggestions.length === 0 ? (
                      <div className="empty-note">
                        No length scores better than its neighbours here.
                      </div>
                    ) : (
                      <>
                      {score.suggestions.every(pt => !isGoodScore(pt, tuner)) && (
                        <div className="control-hint" style={{ marginBottom: '10px' }}>
                          These are the best available, not good ones: every
                          candidate has a band above {TUNERS[tuner].limit}:1. Changing
                          the transformer ratio, or dropping the band in the last
                          column, will do more here than changing length.
                        </div>
                      )}
                      <table>
                        <thead>
                          <tr>
                            <th>Length</th><th>Typical SWR</th><th>Worst</th><th>On</th>
                          </tr>
                        </thead>
                        <tbody>
                          {score.suggestions.map((point, i) => (
                            <tr key={i} className="pick">
                              <td className="best-length">
                                <button className="pick-btn"
                                        onClick={() => setWireLen(point.lenM)}>
                                  {fmtLen(point.lenM, units)}
                                </button>
                              </td>
                              <td>{point.swr.toFixed(1)}:1</td>
                              <td className={point.worst.swr <= TUNERS[tuner].limit
                                ? 'score-ok' : 'score-poor'}>
                                {point.worst.swr.toFixed(1)}:1
                              </td>
                              <td>{point.worst.band.label}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      </>
                    )
                  ) : (<>
                  {solution.suggestions.length === 0 ? (
                    <div className="empty-note">
                      No length clears every selected band at {marginPct}%.
                      {fallback
                        ? <>
                            {' '}The most any length can manage is {fallback.marginPct}%.{' '}
                            <button className="btn link-btn"
                                    onClick={() => set({ marginPct: fallback.marginPct,
                                                         wireLenM: fallback.lengthM })}>
                              Use {fallback.marginPct}% at {fmtLen(fallback.lengthM, units)}
                            </button>
                          </>
                        : ' These bands cover every length between them; drop one.'}
                    </div>
                  ) : (
                    <table>
                      <thead>
                        <tr>
                          <th>Length</th><th>Usable from</th><th>to</th><th>Margin</th>
                        </tr>
                      </thead>
                      <tbody>
                        {solution.suggestions.map((s, i) => (
                          <tr key={i} className="pick">
                            <td className="best-length">
                              <button className="pick-btn"
                                      onClick={() => setWireLen(s.pick)}>
                                {fmtLen(s.pick, units)}
                              </button>
                            </td>
                            <td>{fmtLen(s.lo, units)}</td>
                            <td>{fmtLen(s.hi, units)}</td>
                            <td>+/- {fmtLen(s.clearance, units)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                  </>)}
                </div>
              )}

              {mode === 'impedance' && publishedScores.length > 0 && (
                <div className="panel">
                  <div className="panel-header">Published lengths, scored</div>
                  <div className="control-hint" style={{ marginBottom: '10px' }}>
                    The lengths the usual tables offer, run through this model at
                    your site. Where it disagrees, it is because those tables place
                    a half wave using a velocity factor of 0.95 and this model,
                    fitted against NEC, uses 1.0 &mdash; about 5% longer, which
                    moves what counts as clear of a resonance. Click one to try
                    it. A length is called ok only if it is acceptable on average
                    <em>and</em> on its worst band; several of these are fine on
                    average and unusable on one.
                  </div>
                  <table>
                    <thead>
                      <tr><th>Length</th><th>Average</th><th>Worst band</th>
                          <th>Verdict</th></tr>
                    </thead>
                    <tbody>
                      {publishedScores.map(({ ft, lenM, scored }) => (
                        <tr key={ft} className="pick">
                          <td className="best-length">
                            <button className="pick-btn"
                                    onClick={() => setWireLen(lenM)}>
                              {fmtLen(lenM, units)}
                            </button>
                          </td>
                          <td>{scored === null ? '-' : `${scored.swr.toFixed(1)}:1`}</td>
                          <td>{scored === null ? '-'
                            : `${scored.worst.swr.toFixed(1)}:1 ${scored.worst.band.label}`}</td>
                          <td className={isGoodScore(scored, tuner)
                            ? 'score-ok' : 'score-poor'}>
                            {scored === null ? ''
                              : (isGoodScore(scored, tuner) ? 'ok' : 'poor')}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {!noBands && (
                <div className="panel">
                  <div className="panel-header">Half-wave lengths per band</div>
                  <table>
                    <thead>
                      <tr>
                        <th>Band</th><th>Edges</th><th>λ/2 span</th>
                      </tr>
                    </thead>
                    <tbody>
                      {solution.bands.map(band => {
                        const [lo, hi] = bandEdgesHz(band, segment);
                        return (
                          <tr key={band.m}>
                            <td>{band.label}</td>
                            <td>{fmtBandEdges(lo, hi)}</td>
                            <td>
                              {fmtLen(halfWaveM(hi, displayVf), units)} -{' '}
                              {fmtLen(halfWaveM(lo, displayVf), units)}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  <div className="control-hint right">{BAND_EDGE_UNIT_HINT}</div>
                </div>
              )}

              {deck !== null && (
                <div className="panel">
                  <div className="panel-header">NEC deck</div>
                  <div className="presets">
                    <button className="btn preset-btn" onClick={saveDeck}>
                      Download .nec
                    </button>
                    <button className="btn preset-btn"
                            onClick={saveAntennaSimProject}>
                      Download .antennasim
                    </button>
                  </div>
                  <div className="control-hint">
                    The geometry this model was fitted against: the wire at{' '}
                    {fmtLen(heightM, units)}, the drop and return run making up{' '}
                    {fmtLen(effectiveReturnM, units)}, Sommerfeld
                    ground at {SOILS[soil].epsR} and {SOILS[soil].sigmaSm} S/m,
                    swept across the selected bands. The .nec deck is NEC-2
                    cards for any solver; the .antennasim file is an AntennaSim
                    project, opened from its Wire Editor page, and is the one
                    that carries the soil constants &mdash; its .nec importer
                    drops them and simulates medium soil instead. Neither file
                    carries the {ununRatio}:1: a NEC deck has no transformer in
                    it and AntennaSim's project format has no field for one, so
                    what either reports is the bare feedpoint against 50 ohms.
                    Expect a NEC-2 answer to differ from this page near the
                    ground, where NEC-2's own Sommerfeld evaluation is off; see
                    RANDOM_WIRE_MODEL.md.
                  </div>
                </div>
              )}
            </div>
          </div>

          <div className="info">
            <p>
              An end-fed wire whose length is a multiple of a half wavelength presents a
              very high feedpoint impedance (thousands of ohms), which most tuners and 9:1
              ununs handle badly. <strong>Pick a length that misses every half-wave multiple
              on every band you plan to use</strong>, and keep it at least a quarter wave
              long on the lowest band.
            </p>
            <p>
              Lengths here are physical wire lengths using λ/2 = c / (2 f) times the
              velocity factor; at 0.95 that is the familiar 468 / f(MHz) feet. Real wire
              near ground, with insulators and a counterpoise, will differ, so favor
              lengths with generous margin. A counterpoise or radial system is still
              required; the feedpoint impedance also depends on it.
            </p>
            <p>
              US band edges are from{' '}
              <a href="https://www.law.cornell.edu/cfr/text/47/97.301">47 CFR 97.301</a>
              {' '}as summarised by the{' '}
              <a href="https://www.arrl.org/frequency-allocations">ARRL frequency chart</a>,
              including the{' '}
              <a href="https://www.arrl.org/news/new-60-meter-frequencies-available-as-of-february-13">60m
              rules effective 13 February 2026</a>. Other regions follow the IARU band
              plans; national rules vary within a region, so check your own licence
              conditions before trusting the edges.
            </p>
            <p>
              Method from Mike Markowski AB3AP,{' '}
              <a href="http://udel.edu/~mm/ham/randomWire/">udel.edu/~mm/ham/randomWire/</a>.
            </p>
          </div>

          <div className="footer">
            {'\u00A9'} 2026 Christopher Hoover.{' '}
            <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPL-3.0-or-later</a>.{' '}
            <a href="https://github.com/charlieh0tel/ham_radio">GitHub</a>.{' '}
            <a href="https://github.com/charlieh0tel/ham_radio/issues">Bugs &amp; Feedback</a>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    if (!rootElement) throw new Error('missing #root');
    ReactDOM.createRoot(rootElement).render(<RandomWire />);
  </script>
</body>
</html>
